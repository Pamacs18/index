<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQ Desk — trader development</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e11;--bg2:#101318;--panel:#13161b;--panel2:#181c22;--line:#22272f;--line2:#2e343e;
  --text:#d9dee6;--text2:#b4bcc8;--muted:#7d8592;--faint:#5d6470;
  --accent:#f0a63a;--cyan:#f0a63a;--gold:#f0a63a;--amber:#f0a63a;--bull:#26a69a;--bear:#ef5350;--violet:#9b8cff;--vwap:#ffca28;
  --chart-bg:#0c0e11;--grid:rgba(46,52,62,.55);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f5f7;--bg2:#eceef1;--panel:#ffffff;--panel2:#f6f7f9;--line:#e0e3e8;--line2:#cdd2d9;
  --text:#14171c;--text2:#363c46;--muted:#626a76;--faint:#858c97;
  --accent:#b86e00;--cyan:#b86e00;--gold:#b86e00;--amber:#b86e00;--bull:#0e8a7d;--bear:#d23431;--violet:#5b48d6;--vwap:#a77800;
  --chart-bg:#ffffff;--grid:rgba(160,168,180,.28);color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--text)}h3{font-size:14px;margin:0 0 6px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dim{color:var(--muted)}.up{color:var(--bull)}.dn{color:var(--bear)}.neu{color:var(--accent)}
/* frame */
.frame{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--line)}.brand b{font-size:14px;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:11.5px}
#pnav{display:flex;flex-direction:column;padding:8px}
#pnav a{padding:7px 10px;color:var(--text2);font-size:13.5px;border-left:2px solid transparent}
#pnav a:hover{color:var(--text);background:var(--panel);text-decoration:none}#pnav a.on{color:var(--text);border-left-color:var(--accent);background:var(--panel)}
.side .who{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.strip > div{padding:8px 16px;border-right:1px solid var(--line);min-width:0}
.strip small{display:block;font-size:11px;color:var(--muted)}.strip b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:13.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
main{min-width:0;padding:20px 22px 60px;max-width:1500px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:90ch}
.box{background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.span2{grid-column:span 2}
.sessgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 12px}.kvs.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:12px 0 0}.kvs.mini{grid-template-columns:repeat(4,1fr);gap:6px 10px;font-size:12px}
.kv dt{font-size:11.5px;color:var(--muted)}.kv dd{margin:1px 0 0;font-size:14px}.kvs.mini .kv dd{font-size:12.5px}
.meter{margin-top:10px}.mrowt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{height:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.lrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--text);font-size:13.5px}.lrow:hover{text-decoration:none;color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.eq{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line2);padding:6px 10px}td{padding:7px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.rules td:last-child{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:500;color:var(--text);border-radius:3px}
.btn:hover{border-color:var(--muted);text-decoration:none}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:#1a1205;border-color:transparent}.btn.gold{background:var(--accent);color:#1a1205;border-color:transparent}
.btn.bull{background:var(--bull);color:#fff;border-color:transparent}.btn.bear{background:var(--bear);color:#fff;border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line2);padding:2px;background:var(--bg2);border-radius:3px;flex-wrap:wrap}.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}.seg button.on{background:var(--panel2);color:var(--text)}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line2);padding:0 7px;font-size:11.5px;font-weight:500;color:var(--text2);background:var(--panel2);border-radius:2px;white-space:nowrap}
.b-cyan{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}.b-bull{color:var(--bull);border-color:color-mix(in srgb,var(--bull) 40%,transparent)}.b-bear{color:var(--bear);border-color:color-mix(in srgb,var(--bear) 40%,transparent)}.b-violet{color:var(--violet)}.b-amber,.b-gold{color:var(--accent)}
.note{border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--panel2);padding:10px 14px;font-size:13.5px;color:var(--text2)}.note.bear{border-left-color:var(--bear)}.note.bull{border-left-color:var(--bull)}.note.amber{border-left-color:var(--accent)}.note.violet{border-left-color:var(--violet)}.note b{color:var(--text)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=number],input[type=search],select{height:34px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);padding:0 10px;font:inherit;width:100%;border-radius:3px}
label.f{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.formgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px;font-size:13px}.rulegrid label{display:flex;gap:8px;align-items:center;cursor:pointer}.rulegrid input{accent-color:var(--accent)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.setup{border:1px solid var(--line);padding:8px 10px;margin-top:6px;font-size:12.5px}.setup.ok{border-color:color-mix(in srgb,var(--bull) 50%,var(--line))}.setup .rl{font-size:12px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px}.lt{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.pbm summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin-top:10px}
.log{max-height:300px;overflow-y:auto;font-size:12.5px}.le{padding:6px 0;border-bottom:1px solid var(--line)}.le .dim{font-size:12px}
.chartwrap{position:relative;background:var(--chart-bg);border:1px solid var(--line);overflow:hidden}.chartwrap canvas{display:block;width:100%;touch-action:pan-y}
.synth{position:absolute;top:6px;left:8px;font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:0 6px;background:color-mix(in srgb,var(--chart-bg) 85%,transparent)}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line2);background:var(--bg2);margin:6px 0;cursor:pointer;font-size:14px;color:var(--text);border-radius:3px}.opt .ol{color:var(--muted);font-size:12px;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--muted)}.opt.ok{border-color:var(--bull);background:color-mix(in srgb,var(--bull) 10%,var(--bg2))}.opt.bad{border-color:var(--bear);background:color-mix(in srgb,var(--bear) 10%,var(--bg2))}.opt.ex{opacity:.35}
.drill{max-width:780px}.drillhead{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:8px}.qp{font-size:15.5px;font-weight:500;margin:0 0 10px}
.seqshow{display:flex;flex-direction:column;gap:4px}.seqi{display:flex;gap:10px;font-size:13px}.seqi .num{color:var(--accent)}
/* reused views */
.panel{background:var(--panel);border:1px solid var(--line)}.pad{padding:16px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);padding:14px;color:var(--text)}.card:hover{border-color:var(--line2);text-decoration:none}.card p{color:var(--muted);font-size:13px;margin:5px 0 0}
.lead{color:var(--muted);max-width:80ch;margin:4px 0 16px}
.sec{margin-top:20px}.sec h2{font-size:15px}.sec p{color:var(--text2);max-width:78ch;margin:0}.sec h2 .n{font-size:11px;color:var(--faint);margin-right:10px}
ul.clean,ol.clean{margin:0;padding-left:18px;color:var(--text2)}ul.clean li,ol.clean li{margin:4px 0}
main h1 + .lead{margin-top:6px}
.radar{font:11px/1.4 "JetBrains Mono",monospace;border:1px solid var(--line2);background:var(--bg2);overflow:hidden}.radar .hd{padding:5px 9px;color:var(--accent);font-weight:600}.radar .r{display:flex;justify-content:space-between;gap:10px;padding:2px 9px;border-top:1px solid var(--line)}.radar .r span:first-child{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px;font-size:13px}.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}.opts input{accent-color:var(--accent)}
.term{display:inline-block;border:1px solid var(--line2);padding:0 7px;font-size:12px;margin:2px;color:var(--text2);background:none}
.flip{perspective:1200px;cursor:pointer;height:260px}.flip .in{position:relative;height:100%;transition:transform .4s;transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}.flip .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line2);background:var(--panel);padding:22px;display:flex;flex-direction:column;justify-content:center}.flip .back{transform:rotateY(180deg)}
pre{background:var(--bg2);border:1px solid var(--line);padding:12px;overflow-x:auto;font:12px/1.6 "JetBrains Mono",monospace;color:var(--text2)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:50;transform:translateX(100%);transition:transform .18s;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.scrim.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);padding:22px;z-index:60;display:none;box-shadow:0 20px 50px rgba(0,0,0,.45)}.modal.open{display:block}.modal h2{font-size:17px}
.x{float:right;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.toast{display:none}
@media (max-width:1180px){.sessgrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.formgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.frame{grid-template-columns:1fr}.side{position:static;height:auto}#pnav{flex-direction:row;overflow-x:auto;padding:4px}#pnav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap}#pnav a.on{border-bottom-color:var(--accent)}.side .who,.brand small{display:none}
  .grid3{grid-template-columns:1fr}.span2{grid-column:auto}.two,.legs{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.kvs.mini{grid-template-columns:1fr 1fr}main{padding:16px 12px 50px}.strip > div{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

en.",why:"A gyertya t\xF6m\xF6r\xEDtett t\xF6rt\xE9net: ki ir\xE1ny\xEDtotta az id\u0151szakot, \xE9s mennyire volt sikeres. A hossz\xFA als\xF3 kan\xF3c azt mutatja, hogy az \xE1r lejjebb j\xE1rt, de visszavett\xE9k \u2014 az elad\xF3k nem tudt\xE1k megtartani. A nagy test \xE9s a sz\xE9ls\u0151\xE9rt\xE9k k\xF6zeli z\xE1r\xE1s er\u0151s ir\xE1ny\xEDtott kontrollt jelez.",how:"Range = high \u2212 low. Body% = |close \u2212 open| / range. Close position = (close \u2212 low) / range: 1.0 a gyertya tetej\xE9n, 0.0 az alj\xE1n z\xE1rt. Doji: nagyon kicsi test (d\xF6ntetlen). Hammer: kis test fent, hossz\xFA als\xF3 kan\xF3c. Shooting star: kis test lent, hossz\xFA fels\u0151 kan\xF3c. Bullish engulfing: z\xF6ld test, amely teljesen \xE1tfogja az el\u0151z\u0151 piros testet. Inside bar: teljes range-e az el\u0151z\u0151 gyerty\xE1n bel\xFCl van. Outside bar: nagyobb high \xC9S kisebb low az el\u0151z\u0151n\xE9l. Displacement: szokatlanul nagy, ir\xE1ny\xEDtott gyertya (vagy sorozat), amely gyorsan elmozd\xEDtja az \xE1rat.",recognize:"Ne egyetlen gyerty\xE1t n\xE9zz, hanem a hely\xE9t: egy hammer egy fontos t\xE1maszn\xE1l m\xE1st jelent, mint a range k\xF6zep\xE9n. Impulse = gyors, nagy test\u0171 ir\xE1ny\xEDtott mozg\xE1s; pullback/retracement = ellent\xE9tes ir\xE1ny\xFA visszah\xFAz\xF3d\xE1s; consolidation = kis, \xE1tfed\u0151 gyerty\xE1k s\xE1vban.",whyTraders:"A gyertya a legk\xF6zvetlenebb adat: minden indik\xE1tor ebb\u0151l sz\xE1mol. A rejection (visszautas\xEDt\xE1s) \xE9s a displacement felismer\xE9se seg\xEDt eld\xF6nteni, hogy egy z\xF3n\xE1ban reakci\xF3 t\xF6rt\xE9nt-e.",useful:"Z\xF3n\xE1n\xE1l, szintn\xE9l, a strukt\xFAra fontos pontjain\xE1l; \xE9s bel\xE9p\xE9si triggerk\xE9nt (pl. rejection gyertya high-j\xE1nak z\xE1r\xE1sos t\xF6r\xE9se).",misleading:"Egy mint\xE1zat \xF6nmag\xE1ban gyenge statisztikai el\u0151ny. 1 percen nagyon sok hammer \xE9s engulfing k\xE9pz\u0151dik; a legt\xF6bbnek nincs jelent\u0151s\xE9ge. A gyertya z\xE1r\xE1s\xE1ig a minta nem l\xE9tezik \u2014 a lez\xE1ratlan gyertya m\xE9g b\xE1rmiv\xE9 alakulhat.",bullish:"\xC1r lefel\xE9 l\xE9p egy t\xE1maszra, a gyertya hossz\xFA als\xF3 kan\xF3ccal a range fels\u0151 harmad\xE1ban z\xE1r (hammer), a k\xF6vetkez\u0151 gyertya a hammer high-ja f\xF6l\xE9 z\xE1r. Ez egy elutas\xEDt\xE1s + meger\u0151s\xEDt\xE9s sorozat.",bearish:"\xC1r felj\xF6n egy ellen\xE1ll\xE1sra, bearish engulfing z\xE1r\xE1s, majd a k\xF6vetkez\u0151 gyertya az engulfing low-ja al\xE1 z\xE1r.",reaction:["V\xE1rd meg a gyertya z\xE1r\xE1s\xE1t.","K\xE9rdezd meg: hol t\xF6rt\xE9nt? (szint, z\xF3na, VWAP, range sz\xE9le)","Mit mond a close position \xE9s a body%?","Kell egy k\xF6vetkez\u0151 gyertya meger\u0151s\xEDt\xE9snek (trigger)?","Hol \xE9rv\xE9nytelen\xFCl a gondolat (pl. a kan\xF3c v\xE9ge)?"],mistakes:["Lez\xE1ratlan gyerty\xE1ra reag\xE1lni.","Mint\xE1zatot keresni kontextus n\xE9lk\xFCl.","Minden nagy gyerty\xE1t displacementnek hinni h\xEDr alatt is.","Az \xFCld\xF6z\xE9s: egy nagy impulse gyertya tetej\xE9n venni."]},godmode:{title:"Price Action komponens a k\xF3dban (15-\xF6s s\xFAly)",points:["paScore = 50 + (closePos \u2212 0.5)\xB740 \xB1 body%\xB715 \xB1 10 (engulfing) \xB1 15 (z\xE1r\xE1s az el\u0151z\u0151 20 bar high/low-ja f\xF6l\xF6tt/alatt) \xB1 8 (momentum candle), 0\u2013100 k\xF6z\xE9 v\xE1gva.","Momentum candle a k\xF3dban: body% > 0.65 \xC9S range > ATR.","Engulfing a k\xF3dban: close \u2265 el\u0151z\u0151 open \xE9s open \u2264 el\u0151z\u0151 close (bullish), ellent\xE9tes sz\xEDn\u0171 el\u0151z\u0151 gyerty\xE1val."]},diagram:"candle-anatomy",exercise:{prompt:"Gyertya: O 100, H 104, L 96, C 103.5. Sz\xE1mold ki a body%-ot \xE9s a close positiont, majd a k\xF3d paScore k\xE9plet\xE9nek els\u0151 k\xE9t tagj\xE1t.",steps:["Range = 8, body = 3.5","body% = 0.4375","closePos = 7.5/8 = 0.9375","(0.9375 \u2212 0.5)\xB740 = 17.5; +0.4375\xB715 \u2248 6.56"],answer:"50 + 17.5 + 6.56 \u2248 74.1 (engulfing/breakout/momentum n\xE9lk\xFCl). A gyertya fel\xFCl z\xE1rt, k\xF6zepes testtel: m\xE9rs\xE9kelten bullish price action."},quiz:[{id:"l2q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Mi a hammer jellemz\u0151je?",options:["Hossz\xFA fels\u0151 kan\xF3c","Hossz\xFA als\xF3 kan\xF3c, kis test fel\xFCl","Nincs kan\xF3c","K\xE9t gyerty\xE1s minta"],correct:1,explanation:"A hammer hossz\xFA als\xF3 kan\xF3ca azt mutatja, hogy az alacsonyabb \xE1rakat visszautas\xEDtott\xE1k."},{id:"l2q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mikor momentum candle a GODMODE szerint?",options:["body% > 0.5","body% > 0.65 \xE9s range > ATR","volume > 1.5\xD7 \xE1tlag","close az el\u0151z\u0151 high f\xF6l\xF6tt"],correct:1,explanation:"momCandle = bodyPct > 0.65 and rng > atrSafe."},{id:"l2q3",difficulty:"BEGINNER",type:"true_false",prompt:"Az inside bar teljes range-e az el\u0151z\u0151 gyertya range-\xE9n bel\xFCl van.",options:["Igaz","Hamis"],correct:0,explanation:"Igaz: alacsonyabb high \xE9s magasabb low \u2014 \xF6sszeh\xFAz\xF3d\xE1s."},{id:"l2q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mi\xE9rt vesz\xE9lyes egy lez\xE1ratlan gyerty\xE1ra alapozni?",options:["Mert a volume hi\xE1nyzik","Mert a gyertya m\xE9g b\xE1rmiv\xE9 alakulhat","Mert az ATR v\xE1ltozik","Nem vesz\xE9lyes"],correct:1,explanation:"A forma csak z\xE1r\xE1skor v\xE9gleges. A GODMODE ez\xE9rt alapb\xF3l csak meger\u0151s\xEDtett gyerty\xE1n jelez."}],requires:["financial-markets"]},{slug:"market-structure",level:3,tier:"BEGINNER",title:"Piaci strukt\xFAra: HH, HL, LH, LL, BOS, CHoCH",titleEn:"Market structure",summary:"Swingek, trendek, a strukt\xFAra t\xF6r\xE9se \xE9s jellegv\xE1lt\xE1sa \u2014 \xE9s mi\xE9rt k\xE9sik minden meger\u0151s\xEDtett pivot.",terms:["Higher High","Higher Low","Lower High","Lower Low","Uptrend","Downtrend","Sideways market","Break of Structure","Change of Character","Market Structure Shift","Swing high","Swing low","Internal structure","External structure","Pivot"],sections:{what:"A piaci strukt\xFAra a swing high-ok \xE9s swing low-ok sorrendje. Emelked\u0151 trend: Higher High (HH) \xE9s Higher Low (HL) sorozat. Cs\xF6kken\u0151 trend: Lower High (LH) \xE9s Lower Low (LL). Oldalaz\xE1s (range): a cs\xFAcsok \xE9s m\xE9lypontok nagyj\xE1b\xF3l egy s\xE1vban maradnak. BOS (Break of Structure): egy kor\xE1bbi swing szint z\xE1r\xE1sos \xE1tt\xF6r\xE9se a trend ir\xE1ny\xE1ba. CHoCH (Change of Character) / MSS (Market Structure Shift): az els\u0151 t\xF6r\xE9s a trenddel szemben \u2014 lehets\xE9ges fordulat jele.",why:"A strukt\xFAra a kereslet-k\xEDn\xE1lat egyens\xFAly\xE1nak lenyomata. Ha a vev\u0151k minden visszah\xFAz\xF3d\xE1sn\xE1l magasabban l\xE9pnek be (HL), \xE9s minden emelked\xE9s \xFAj cs\xFAcsot \xE9r el (HH), a vev\u0151k ir\xE1ny\xEDtanak. Amikor ez megszakad, megv\xE1ltozik a kock\xE1zat.",how:"Swing high (pivot high): egy gyertya high-ja magasabb, mint a bal \xE9s jobb oldali N gyerty\xE1\xE9. A pivot csak N jobb oldali gyertya UT\xC1N ismerhet\u0151 fel \u2014 ez a meger\u0151s\xEDt\xE9s \xE1ra: k\xE9s\xE9s. External structure: a nagyobb, f\u0151 swingek; internal structure: a k\xF6ztes kisebb swingek.",recognize:"Jel\xF6ld meg a legut\xF3bbi k\xE9t swing high-t \xE9s swing low-t. Ha az \xFAjabb magasabb \u2192 HH/HL. Ha a legut\xF3bbi swing low-t z\xE1r\xE1ssal al\xE1t\xF6ri az \xE1r egy emelked\u0151 trendben \u2192 CHoCH lehet\u0151s\xE9ge. Strukt\xFAr\xE1lis kudarc (structural failure): egy BOS ut\xE1n az \xE1r gyorsan visszaz\xE1r a t\xF6r\xE9si szint m\xF6g\xE9.",whyTraders:"A strukt\xFAra adja meg a \u201Emelyik oldalr\xF3l keressek setupot\u201D k\xE9rd\xE9s alapv\xE1lasz\xE1t, \xE9s logikus invalid\xE1ci\xF3s pontokat (pl. a legut\xF3bbi HL alatt).",useful:"Trendes szakaszokban; nagyobb id\u0151s\xEDkon (5m, 15m) k\xFCl\xF6n\xF6sen, amit az 1 perces v\xE9grehajt\xE1s kontextusak\xE9nt haszn\xE1lsz.",misleading:"1 percen rengeteg mini-swing van, a strukt\xFAra zajos. A visszatekint\u0151 chart csal\xF3ka: a pivot ott l\xE1tszik, ahol a swing volt, de \xE9l\u0151ben csak N gyerty\xE1val k\xE9s\u0151bb v\xE1lt ismertt\xE9.",bullish:"HL kialakul, majd az \xE1r az utols\xF3 swing high f\xF6l\xE9 z\xE1r: bullish BOS. A k\xF6vetkez\u0151 visszah\xFAz\xF3d\xE1s a HL f\xF6l\xF6tt tart \u2192 a trend \xE9p.",bearish:"LH ut\xE1n az \xE1r az utols\xF3 swing low al\xE1 z\xE1r: bearish BOS. Ha egy emelked\u0151 trendben ez az els\u0151 ilyen t\xF6r\xE9s, az CHoCH.",reaction:["Azonos\xEDtsd a legut\xF3bbi meger\u0151s\xEDtett swingeket.","D\xF6ntsd el: trend, range vagy \xE1tmenet?","BOS a trend ir\xE1ny\xE1ba: keress visszatesztet, ne \xFCld\xF6zz.","CHoCH: lass\xEDts, kisebb m\xE9ret vagy v\xE1rakoz\xE1s a meger\u0151s\xEDt\xE9sre.","Az invalid\xE1ci\xF3 mindig egy strukt\xFArapont m\xF6g\xF6tt legyen."],mistakes:["A pivotot \xE9l\u0151ben m\xE1r a cs\xFAcs gyerty\xE1j\xE1n \u201El\xE1tni\u201D.","Minden mini-swinget k\xFCl\xF6n trendnek venni.","Kan\xF3cos \xE1tt\xF6r\xE9st BOS-nak tekinteni z\xE1r\xE1s n\xE9lk\xFCl.","Range-ben trendk\xF6vet\u0151 setupot er\u0151ltetni."]},godmode:{title:"Market Structure a v1.7-ben",points:["A Radar strukt\xFAra modul pivotLen = 5 bal \xE9s 5 jobb gyerty\xE1val dolgozik (ta.pivothigh/pivotlow).","Csak a legut\xF3bbi k\xE9t meger\u0151s\xEDtett pivot high \xE9s low-t hasonl\xEDtja: HH, LH, HL, LL logikai jelz\u0151k.","msScore = 50 + (HH+HL \u2212 LH\u2212LL)\xB725, a dashboard \xE1llapota BULLISH (HH \xE9s HL), BEARISH (LH \xE9s LL), BULL/BEAR BIAS vagy RANGE.","FONTOS: a v1.7 NEM rajzol HH/HL/LH/LL c\xEDmk\xE9ket a chartra. Ezek bels\u0151 \xE1llapotok. A szimul\xE1torban l\xE1that\xF3 HH/HL c\xEDmk\xE9k az Akad\xE9mia oktat\xE1si r\xE9tegei.","A charton l\xE1that\xF3 \u201EOB BOS\u201D az Order Block modul k\xFCl\xF6n, 3-as pivot\xFA t\xF6r\xE9sjele, nem a Radar strukt\xFAra modulja."]},diagram:"structure-identify",exercise:{prompt:"Swing sorozat: L 100, H 110, L 104, H 115, L 108, H 112, L 102.",steps:["C\xEDmk\xE9zd a pontokat.","Hol romlott el a bullish strukt\xFAra?","Melyik pont a CHoCH?"],answer:"H110 \u2192 HL104 \u2192 HH115 \u2192 HL108 \u2192 LH112 \u2192 LL102. A 112 az els\u0151 LH (gyeng\xFCl\xE9s), a 108 alatti z\xE1r\xE1s a CHoCH / bearish MSS."},quiz:[{id:"l3q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Mi jellemzi az emelked\u0151 trendet?",options:["LH + LL","HH + HL","HH + LL","Csak HH"],correct:1,explanation:"Magasabb cs\xFAcsok \xE9s magasabb m\xE9lypontok."},{id:"l3q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Pivot length 5 mellett mikor ismeri fel a k\xF3d a swing high-t?",options:["Azonnal","5 gyerty\xE1val k\xE9s\u0151bb","10 gyerty\xE1val k\xE9s\u0151bb","A k\xF6vetkez\u0151 napon"],correct:1,explanation:"A pivot a jobb oldali 5 gyertya lez\xE1r\xE1sa ut\xE1n meger\u0151s\xEDtett."},{id:"l3q3",difficulty:"INTERMEDIATE",type:"true_false",prompt:"A GODMODE v1.7 HH/HL/LH/LL c\xEDmk\xE9ket rajzol a chartra.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Ezek csak bels\u0151 \xE1llapotok a Radar Structure sor\xE1ban."},{id:"l3q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mi a CHoCH?",options:["Folytat\xF3lagos t\xF6r\xE9s","Az els\u0151 t\xF6r\xE9s a megl\xE9v\u0151 trenddel szemben","Egy FVG t\xEDpus","Volume cs\xFAcs"],correct:1,explanation:"Change of Character: a trend jelleg\xE9nek els\u0151 jelzett megv\xE1ltoz\xE1sa."}],requires:["candlesticks-price-action"]},{slug:"liquidity",level:4,tier:"INTERMEDIATE",title:"Likvidit\xE1s: BSL, SSL, sweep \xE9s stop hunt",titleEn:"Liquidity",summary:"Hol lehetnek stopok \xE9s f\xFCgg\u0151 megb\xEDz\xE1sok, mi a liquidity sweep \u2014 \xE9s mi\xE9rt nem bizony\xEDt\xE9k egy kan\xF3c a manipul\xE1ci\xF3ra.",terms:["Liquidity","Buy-side liquidity","Sell-side liquidity","Equal highs","Equal lows","Liquidity pool","Liquidity sweep","Stop hunt","Inducement","Liquidity grab","Previous day high","Previous day low","Session high","Session low"],sections:{what:"Likvidit\xE1s (liquidity) a piacon az el\xE9rhet\u0151 ellenoldali megb\xEDz\xE1sok mennyis\xE9ge. A tradingnyelvben gyakran \xE1rszinteket is \xEDgy h\xEDvnak, ahol sok megb\xEDz\xE1s koncentr\xE1l\xF3dhat. Buy-side liquidity (BSL): swing high-ok, equal highs, el\u0151z\u0151 napi cs\xFAcs (PDH) f\xF6l\xF6tt \u2014 itt \xFClnek a shortok stopjai (v\xE9teli stop) \xE9s a kit\xF6r\xE9sre v\xE1r\xF3 v\xE9teli megb\xEDz\xE1sok. Sell-side liquidity (SSL): swing low-k, equal lows, el\u0151z\u0151 napi m\xE9lypont (PDL) alatt.",why:"Egy nagy megb\xEDz\xE1s v\xE9grehajt\xE1s\xE1hoz ellenoldal kell. Egy nagy vev\u0151nek elad\xF3k kellenek: ezek lehetnek a swing low alatt kiold\xF3d\xF3 stopok. Ez\xE9rt az \xE1r gyakran el\xE9ri ezeket a nyilv\xE1nval\xF3 szinteket \u2014 nem felt\xE9tlen\xFCl \xF6sszeesk\xFCv\xE9s, egyszer\u0171en ott van a forgalom.",how:"Liquidity sweep / grab: az \xE1r egy nyilv\xE1nval\xF3 szint f\xF6l\xE9/al\xE1 sz\xFAr (gyakran kan\xF3ccal), majd visszaz\xE1r a szint m\xF6g\xE9. Stop hunt: ugyanez a kioldott stopok n\xE9z\u0151pontj\xE1b\xF3l. Inducement: egy kisebb, \u201Ecsali\u201D szint, ami korai bel\xE9p\xE9sre cs\xE1b\xEDt a val\xF3di mozg\xE1s el\u0151tt. Liquidity pool: t\xF6bb egym\xE1shoz k\xF6zeli szint (equal highs/lows) egy\xFCtt.",recognize:"Keress kett\u0151s/t\xF6bbes egyforma cs\xFAcsot vagy m\xE9lypontot, el\u0151z\u0151 napi \xE9s el\u0151z\u0151 session high/low-t, a nyit\xF3 range sz\xE9leit. Sweep ut\xE1n n\xE9zd: visszaz\xE1rt-e az \xE1r a szint m\xF6g\xE9, \xE9s j\xF6n-e strukt\xFArav\xE1lt\xE1s (CHoCH) az ellenkez\u0151 ir\xE1nyba?",whyTraders:"C\xE9lpontot ad (hov\xE1 mehet az \xE1r), \xE9s figyelmeztet, hov\xE1 NE tegy\xE9l stopot (k\xF6zvetlen\xFCl egy nyilv\xE1nval\xF3 szint m\xF6g\xE9).",useful:"Napi el\u0151k\xE9sz\xFCletben (PDH/PDL, session high/low megjel\xF6l\xE9se), c\xE9l\xE1r kijel\xF6l\xE9sn\xE9l, \xE9s sweep + CHoCH fordul\xF3s setupokn\xE1l.",misleading:"Egy kan\xF3c egy szint m\xF6g\xF6tt NEM bizony\xEDtja, hogy int\xE9zm\xE9nyi manipul\xE1ci\xF3 t\xF6rt\xE9nt. Lehet egyszer\u0171 volatilit\xE1s, h\xEDr, algoritmikus likvidit\xE1s vagy v\xE9letlen. A chartr\xF3l nem l\xE1tod, kik voltak a megb\xEDz\xE1sok m\xF6g\xF6tt. A sweep gyakran nem fordul vissza, hanem val\xF3di kit\xF6r\xE9ss\xE9 v\xE1lik.",bullish:"\xC1r a PDL al\xE1 sz\xFAr, a gyertya visszaz\xE1r f\xF6l\xE9, majd bullish CHoCH (az utols\xF3 LH z\xE1r\xE1sos \xE1tt\xF6r\xE9se). A sweep alja ad logikus invalid\xE1ci\xF3t.",bearish:"Equal highs f\xF6l\xE9 sz\xFAr\xE1s, visszaz\xE1r\xE1s al\xE1, majd bearish BOS az utols\xF3 HL alatt; c\xE9l a k\xF6vetkez\u0151 SSL.",reaction:["Jel\xF6ld meg el\u0151re a nyilv\xE1nval\xF3 likvidit\xE1si szinteket.","Sweepn\xE9l ne ugorj azonnal: v\xE1rd a visszaz\xE1r\xE1st.","K\xE9rj strukt\xFArav\xE1lt\xE1st (CHoCH) meger\u0151s\xEDt\xE9snek.","A stopot ne k\xF6zvetlen\xFCl a nyilv\xE1nval\xF3 szint m\xF6g\xE9 tedd tolerancia n\xE9lk\xFCl.","C\xE9lnak a k\xF6vetkez\u0151 ellenoldali likvidit\xE1st haszn\xE1ld."],mistakes:["Minden kan\xF3cot stop huntnak nevezni.","Sweep k\xF6zben ellentrendbe ugrani meger\u0151s\xEDt\xE9s n\xE9lk\xFCl.","Elhinni, hogy \u201E\u0151k\u201D mindig levad\xE1ssz\xE1k a stopodat \u2014 ez rossz stop-helyet pal\xE1stol.","A kit\xF6r\xE9st automatikusan hamisnak tekinteni."]},godmode:{title:"Mit l\xE1t ebb\u0151l a v1.7?",points:["Nincs k\xFCl\xF6n liquidity modul; a k\xF3d nem l\xE1tja az order bookot, a stopokat vagy a f\xFCgg\u0151 megb\xEDz\xE1sokat.","K\xF6zvetett kapcsol\xF3d\xE1s: a Price Action komponens figyeli a z\xE1r\xF3 \xE1rat az el\u0151z\u0151 20 bar high/low-j\xE1hoz k\xE9pest (breakout \xB115 pont), az OR modul a nyit\xF3 range sz\xE9leit.","A PDH/PDL \xE9s session high/low megjel\xF6l\xE9se a TE el\u0151k\xE9sz\xEDt\u0151 feladatod \u2014 ez Akad\xE9mia-m\xF3dszertan, nem indik\xE1torfunkci\xF3."]},diagram:"liquidity-sweep",exercise:{prompt:"El\u0151z\u0151 napi low 20 000. Ma 09:41-kor egy gyertya low-ja 19 994, close 20 006. A k\xF6vetkez\u0151 3 gyertya egyre magasabb low-val z\xE1r, majd az \xE1r az utols\xF3 lower high (20 018) f\xF6l\xE9 z\xE1r.",steps:["Mi t\xF6rt\xE9nt 09:41-kor?","Mi a meger\u0151s\xEDt\xE9s?","Hol lenne logikus invalid\xE1ci\xF3?"],answer:"SSL sweep a PDL alatt visszaz\xE1r\xE1ssal. A 20 018 feletti z\xE1r\xE1s bullish CHoCH. Invalid\xE1ci\xF3 a sweep alja (19 994) alatt, puffer-rel \u2014 \xE9s csak akkor, ha az R:R ezt elb\xEDrja."},quiz:[{id:"l4q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Hol van tipikusan buy-side liquidity?",options:["Swing low-k alatt","Swing high-ok f\xF6l\xF6tt","A VWAP-on","Az EMA 50-en"],correct:1,explanation:"A shortok stopjai (v\xE9teli stopok) \xE9s kit\xF6r\xE9si v\xE9telek a cs\xFAcsok f\xF6l\xF6tt."},{id:"l4q2",difficulty:"INTERMEDIATE",type:"true_false",prompt:"Egy szint alatti kan\xF3c bizony\xEDtja az int\xE9zm\xE9nyi stop huntot.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. A chart nem mutatja, kik kereskedtek; sok m\xE1s magyar\xE1zat lehets\xE9ges."},{id:"l4q3",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mi tesz egy sweepet tradelhet\u0151bb\xE9?",options:["Nagy kan\xF3c","Visszaz\xE1r\xE1s + ellent\xE9tes strukt\xFArav\xE1lt\xE1s","RSI 30 alatt","H\xE9tf\u0151 reggel"],correct:1,explanation:"A visszaz\xE1r\xE1s \xE9s a CHoCH mutatja, hogy a szint m\xF6g\xF6tt nem maradt elfogad\xE1s."},{id:"l4q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Van-e liquidity modul a GODMODE v1.7-ben?",options:["Igen, BSL/SSL vonalakkal","Nincs; a PDH/PDL jel\xF6l\xE9s saj\xE1t feladat","Igen, order book alapj\xE1n","Csak a VWAP-ban"],correct:1,explanation:"A k\xF3dban nincs liquidity modul."}],requires:["market-structure"]},{slug:"order-blocks",level:5,tier:"INTERMEDIATE",title:"Order Block-ok",titleEn:"Order blocks",summary:"Az utols\xF3 ellenir\xE1ny\xFA gyertya a BOS el\u0151tt \u2014 pontosan \xFAgy, ahogy a v1.7 kijel\xF6li, mitig\xE1lja \xE9s invalid\xE1lja.",terms:["Order Block","Bullish Order Block","Bearish Order Block","Last opposing candle","BOS confirmation","Displacement","Fresh Order Block","Mitigation","Invalidation","OB retest","Order Block failure","Full candle range","Body-only range"],sections:{what:"Az Order Block (OB) egy \xE1rz\xF3na: a strukt\xFArat\xF6r\xE9st (BOS) okoz\xF3 elmozdul\xE1s el\u0151tti utols\xF3 ellenir\xE1ny\xFA gyertya tartom\xE1nya. Bullish OB: az utols\xF3 bearish gyertya egy felfel\xE9 ir\xE1nyul\xF3 BOS el\u0151tt. Bearish OB: az utols\xF3 bullish gyertya egy lefel\xE9 ir\xE1nyul\xF3 BOS el\u0151tt.",why:"Az elm\xE9let szerint ahol egy er\u0151s elmozdul\xE1s elindult, ott nagyobb megb\xEDz\xE1sok lehettek, \xE9s az \xE1r visszat\xE9r\xE9sekor \xFAjra reakci\xF3 j\xF6het. Gyakorlatilag: az OB egy objekt\xEDv, el\u0151re megrajzolhat\xF3 z\xF3na, ahol visszatesztet lehet figyelni, \xE9s ami m\xF6g\xE9 logikus stop tehet\u0151.",how:"1) Swing high/low meger\u0151s\xEDt\xE9se. 2) Z\xE1r\xE1s a swing szint f\xF6l\xF6tt/alatt (BOS). 3) Visszafel\xE9 keres\xE9s az utols\xF3 ellenir\xE1ny\xFA gyerty\xE1ig. 4) A z\xF3na lehet a teljes gyertya (high-low) vagy csak a test (body only). 5) Friss (fresh) am\xEDg az \xE1r vissza nem t\xE9r. Az els\u0151 visszat\xE9r\xE9s a mitig\xE1ci\xF3. Invalid\xE1ci\xF3: z\xE1r\xE1s (vagy kan\xF3c) a z\xF3na t\xFAloldal\xE1n.",recognize:"Keress BOS-t, majd l\xE9pj vissza: hol volt az utols\xF3 piros gyertya a felfel\xE9 t\xF6r\xE9s el\u0151tt? Annak range-e a z\xF3na. Egy er\u0151sebb OB-t gyakran displacement k\xF6vet (nagy test\u0171 gyerty\xE1k), \xE9s \xE1tfedhet egy FVG-vel.",whyTraders:"El\u0151re defini\xE1lt hely, ahol a keresked\u0151 nem \xFCld\xF6z, hanem visszatesztet v\xE1r, egy\xE9rtelm\u0171 invalid\xE1ci\xF3val.",useful:"Trendes k\xF6rnyezetben, a trend ir\xE1ny\xE1ba es\u0151 friss OB-kn\xE1l, amelyek m\xE1s kontextussal (VWAP, EMA, FVG) egybeesnek.",misleading:"1 percen nagyon sok OB keletkezik; a nagy r\xE9sz\xFCk semmit sem jelent. Az OB nem \u201Eint\xE9zm\xE9nyi megb\xEDz\xE1s l\xE1that\xF3 nyoma\u201D \u2014 a chartb\xF3l nem l\xE1tszik, ki kereskedett. Oldalaz\xE1sban az OB-k gyorsan mitig\xE1l\xF3dnak \xE9s invalid\xE1l\xF3dnak.",bullish:"Swing high meger\u0151s\xEDtve 20 050-en. Z\xE1r\xE1s 20 052-n \u2192 BOS. Visszafel\xE9 az utols\xF3 bearish gyertya: H 20 041 / L 20 036 \u2192 bullish OB 20 036\u201320 041. Az \xE1r k\xE9s\u0151bb 20 039-re t\xE9r vissza: OB MITIGATED. Ha bullish rejection \xE9s trigger j\xF6n, az lehet saj\xE1t bel\xE9p\xE9si szab\xE1lyod alapja.",bearish:"Swing low 19 980 alatt z\xE1r\xE1s \u2192 BOS. Az utols\xF3 bullish gyertya (H 19 995 / L 19 989) a bearish OB. Visszaemelked\xE9skor figyeld a reakci\xF3t; ha z\xE1r\xE1s j\xF6n 19 995 f\xF6l\xF6tt (Close m\xF3d), a z\xF3na invalid\xE1lt.",reaction:["OB BOS: ne l\xE9pj be, jel\xF6ld a z\xF3n\xE1t.","Kontextus: a z\xF3na a trend ir\xE1ny\xE1ba esik? VWAP/EMA melyik oldal\xE1n vagy?","V\xE1rd az els\u0151 visszat\xE9r\xE9st (first touch / mitig\xE1ci\xF3).","K\xE9rj reakci\xF3t \xE9s saj\xE1t triggert (pl. rejection + gyertya t\xF6r\xE9s).","Stop a z\xF3na m\xF6g\xF6tt; ha a stop t\xFAl nagy, nincs trade."],mistakes:["Az OB BOS gyerty\xE1j\xE1n bel\xE9pni.","Mitig\xE1lt vagy invalid\xE1lt z\xF3n\xE1t frissk\xE9nt kezelni.","Minden OB-t egyform\xE1n er\u0151snek tekinteni.","Ellentrend OB-ra t\xE1maszkodni er\u0151s trendben."]},godmode:{title:"A v1.7 OB detektor pontosan",points:["Saj\xE1t pivotok: obSwingLen = 3 (bal \xE9s jobb). F\xFCggetlen a Radar 5-\xF6s pivotj\xE1t\xF3l.","Bullish BOS: meger\u0151s\xEDtett gyertya close > utols\xF3 swing high \xC9S el\u0151z\u0151 close \u2264 swing high, \xE9s a szintet m\xE9g nem t\xF6rte.","Displacement sz\u0171r\u0151 alapb\xF3l OFF; ha ON: a BOS gyertya teste \u2265 0.7 \xD7 ATR.","Keres\xE9s legfeljebb 12 gyerty\xE1val visszafel\xE9 (obLookback) az els\u0151 ellenir\xE1ny\xFA gyerty\xE1ig.","Z\xF3na: Full candle (high\u2013low) alapb\xF3l; Body only opci\xF3.","\xC1llapot: 0 FRESH \u2192 1 MITIGATED (low \u2264 top \xE9s high \u2265 bottom) vagy 2 INVALIDATED. Close m\xF3dban bull OB: close < bottom; Wick m\xF3dban: low < bottom. Invalid\xE1ci\xF3 els\u0151bbs\xE9get \xE9lvez az \xE9rint\xE9ssel szemben.","Mitig\xE1lt \xE9s invalid\xE1lt z\xF3na egyar\xE1nt sz\xFCrke \u2014 olvasd el a felirat\xE1t.","Maximum 20 z\xF3na; a legr\xE9gebbiek t\xF6rl\u0151dnek.","Jel\xF6l\xE9sek: \u201EOB BOS\u201D c\xEDmke \xE9s h\xE1romsz\xF6g az els\u0151 \xE9rint\xE9skor. Nincs automatikus OB entry."]},diagram:"ob-draw",exercise:{prompt:"Nyisd meg az interakt\xEDv OB rajzol\xF3t: jel\xF6ld ki az utols\xF3 ellenir\xE1ny\xFA gyerty\xE1t a BOS el\u0151tt, majd hasonl\xEDtsd \xF6ssze a k\xF3d z\xF3n\xE1j\xE1val Full candle \xE9s Body only m\xF3dban.",steps:["Keresd meg a BOS gyerty\xE1t.","L\xE9pj vissza az els\u0151 ellenir\xE1ny\xFA gyerty\xE1ig (max 12).","Jel\xF6ld a high\u2013low tartom\xE1nyt.","V\xE1ltsd Body only-ra: mi v\xE1ltozott?"],answer:"Body only m\xF3dban a z\xF3na sz\u0171kebb (open\u2013close), ez\xE9rt ritk\xE1bban \xE9rintik, \xE9s a stop is sz\u0171kebb lehet \u2014 de k\xF6nnyebben \u201E\xE1tsz\xFArja\u201D a kan\xF3c."},quiz:[{id:"l5q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Melyik gyertya lesz bullish OB a v1.7-ben?",options:["A BOS gyertya","Az utols\xF3 bearish gyertya a BOS el\u0151tt (max 12 bar)","A legnagyobb volume-\xFA gyertya","A swing high gyerty\xE1ja"],correct:1,explanation:"for i = 1 to obLookback: az els\u0151 close < open gyertya."},{id:"l5q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mi t\xF6rt\xE9nik, ha ugyanazon a gyerty\xE1n teljes\xFCl az \xE9rint\xE9s \xE9s az invalid\xE1ci\xF3?",options:["MITIGATED","INVALIDATED","Mindkett\u0151","Semmi"],correct:1,explanation:"A k\xF3d el\u0151bb az invalid\xE1ci\xF3t vizsg\xE1lja."},{id:"l5q3",difficulty:"BEGINNER",type:"true_false",prompt:"Az OB BOS c\xEDmke bel\xE9p\xE9si jel.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. A k\xF3d nem ad automatikus OB entryt."},{id:"l5q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Alapb\xF3l be van kapcsolva a displacement sz\u0171r\u0151?",options:["Igen, 0.7 ATR","Nem, OFF","Igen, 0.5 ATR","Csak NY sessionben"],correct:1,explanation:"obUseDisplacement = false alap\xE9rt\xE9ken."}],requires:["liquidity"]}];var Ba=[{slug:"fair-value-gaps",level:6,tier:"INTERMEDIATE",title:"Fair Value Gap-ek \xE9s a GODMODE \xE9letciklus",titleEn:"Fair value gaps",summary:"H\xE1romgyerty\xE1s imbalance, CE, first touch, rejection, entry trigger, filled \u2014 \xF6t k\xFCl\xF6n \xE1llapot, amelyek k\xF6z\xFCl csak egy a trigger.",terms:["Fair Value Gap","Imbalance","Three-candle structure","Consequent Encroachment","First touch","Rejection","Retest","Filling","Invalidation","Displacement"],sections:{what:"A Fair Value Gap (FVG) egy h\xE1romgyerty\xE1s minta, amelyben az 1. \xE9s a 3. gyertya \xE1rai nem fedik egym\xE1st: a k\xF6z\xE9ps\u0151 gyertya olyan gyorsan mozd\xEDtotta az \xE1rat, hogy egy s\xE1vban csak egy ir\xE1nyba volt keresked\xE9s. Bullish FVG: a 3. gyertya low-ja magasabb, mint az 1. gyertya high-ja. Bearish FVG: a 3. gyertya high-ja alacsonyabb, mint az 1. gyertya low-ja. A z\xF3na 50%-os k\xF6z\xE9pvonala a Consequent Encroachment (CE).",why:"Az imbalance azt jelzi, hogy az \xE1r \u201Ekihagyott\u201D egy tartom\xE1nyt. Sok keresked\u0151 figyeli ezeket a visszat\xE9r\xE9s lehets\xE9ges helyek\xE9nt. Ez \xF6nbeteljes\xEDt\u0151 is lehet: ha sokan figyelik, ott reakci\xF3 is lehet.",how:"Bullish FVG: low[0] > high[2] \u2192 z\xF3na: als\xF3 sz\xE9l = high[2], fels\u0151 sz\xE9l = low[0]. Bearish: high[0] < low[2] \u2192 als\xF3 sz\xE9l = high[0], fels\u0151 = low[2]. CE = (fels\u0151 + als\xF3) / 2. Az \xE1r visszat\xE9r\xE9sekor a z\xF3na els\u0151 \xE9rint\xE9se (first touch), ut\xE1na egy z\xE1r\xF3 \xE1r a CE (vagy a teljes z\xF3na) t\xFAloldal\xE1n a rejection, egy k\xE9s\u0151bbi gyertya pedig a rejection gyertya high/low-j\xE1nak t\xF6r\xE9s\xE9vel adja a triggert. Ha az \xE1r el\xE9ri a z\xF3na t\xFAloldali sz\xE9l\xE9t, a gap kit\xF6lt\u0151d\xF6tt (filled).",recognize:"N\xE9zd a nagy test\u0171 k\xF6z\xE9ps\u0151 gyerty\xE1t \xE9s a k\xE9t szomsz\xE9dja kan\xF3cait: ha a kan\xF3cok k\xF6z\xF6tt \xFCres s\xE1v maradt, az FVG. 1 percen nagyon sok ilyen van; a nagyobb, displacement ut\xE1n keletkez\u0151, trendir\xE1ny\xFA gapek a relev\xE1nsabbak.",whyTraders:"Pontos, m\xE9rhet\u0151 z\xF3n\xE1t ad. Az \xE9letciklus-gondolkod\xE1s (\xE9rint\xE9s \u2260 rejection \u2260 trigger) megv\xE9d az elhamarkodott bel\xE9p\xE9st\u0151l.",useful:"Trendir\xE1ny\xFA FVG-k els\u0151 visszatesztj\xE9n\xE9l, k\xFCl\xF6n\xF6sen ha \xE1tfednek egy friss OB-val vagy a VWAP/EMA k\xF6zel\xE9ben vannak.",misleading:"Oldalaz\xE1sban az FVG-k sorra kit\xF6lt\u0151dnek. Nem minden gap z\xE1r\xF3dik; \xE9s nem mindegyik ad reakci\xF3t. Az FVG nem az int\xE9zm\xE9nyi order book lenyomata \u2014 tiszt\xE1n \xE1rgeometria.",bullish:"FVG+ 20 101\u201320 103 (CE 20 102). Az \xE1r visszaesik, egy gyertya low-ja 20 102.5 (first touch, t\xFCrkiz pont), close 20 104 > CE \u2192 FVG REJ (ugyanazon a gyerty\xE1n). A rejection high 20 108. K\xE9t gyerty\xE1val k\xE9s\u0151bb close 20 109 > 20 108 \u2192 FVG LONG.",bearish:"FVG- z\xF3na, az \xE1r visszaemelkedik (narancs pont), a gyertya a CE al\xE1 z\xE1r \u2192 piros FVG REJ. Egy k\xE9s\u0151bbi z\xE1r\xE1s a rejection low alatt \u2192 FVG SHORT. Ha ehelyett az \xE1r a z\xF3na fels\u0151 sz\xE9l\xE9ig fut \u2192 FVG FILLED, a setup lez\xE1rult.",reaction:["FVG+ / FVG-: jel\xF6ld, ne l\xE9pj.","First touch pont: figyelj, ne l\xE9pj.","FVG REJ: jegyezd fel a rejection gyertya high/low-j\xE1t \u2014 ez a trigger szint.","FVG LONG/SHORT: most ellen\u0151rizd a kontextust, a stop hely\xE9t \xE9s az R:R-t.","FVG FILLED: a z\xF3na lez\xE1rult, ne haszn\xE1ld \xFAj first-touch z\xF3nak\xE9nt."],mistakes:["Az FVG+ megjelen\xE9sekor bel\xE9pni.","A first-touch pontot entry-nek venni.","A REJ gyerty\xE1j\xE1n bel\xE9pni a trigger megv\xE1r\xE1sa n\xE9lk\xFCl.","Kit\xF6lt\xF6tt gapet \xFAjra friss z\xF3n\xE1nak kezelni.","A trigger ut\xE1n a stopot \xE9s az R:R-t ellen\u0151rizetlen\xFCl hagyni."]},godmode:{title:"A v1.7 FVG \xE9letciklus \u2014 k\xF3d szerint",points:["\xC1llapotok: 0 Fresh \u2192 1 Touched \u2192 2 Rejected \u2192 3 Entry trigger \u2192 4 Filled. Minden \xE1llapotv\xE1lt\xE1s meger\u0151s\xEDtett gyerty\xE1n.","First touch: low \u2264 top \xE9s high \u2265 bottom. Bullish z\xF3n\xE1n\xE1l T\xDCRKIZ, bearish z\xF3n\xE1n\xE1l NARANCS pont. A pont nem \xFAj z\xF3n\xE1t jel\xF6l, hanem egy megl\xE9v\u0151 els\u0151 visszatesztj\xE9t.","Rejection \u2014 CE reclaim (alap): bullish close > CE, bearish close < CE. Full zone reclaim: bullish close > fels\u0151 sz\xE9l, bearish close < als\xF3 sz\xE9l.","Egy touch gyertya azonnal rejection is lehet, ha a z\xE1r\xF3 \xE1r teljes\xEDti a felt\xE9telt.","Entry trigger \u2014 Close beyond rejection candle (alap): egy K\xC9S\u0150BBI gyertya close-a a rejection high f\xF6l\xF6tt / low alatt. Wick break m\xF3dban el\xE9g a high/low t\xF6r\xE9se, de a jel\xF6l\xE9s \xEDgy is gyertyaz\xE1r\xE1skor j\xF6n.","Filled: bullish low \u2264 als\xF3 sz\xE9l, bearish high \u2265 fels\u0151 sz\xE9l. Els\u0151bbs\xE9get \xE9lvez minden m\xE1s \xE1llapotv\xE1lt\xE1ssal szemben az adott gyerty\xE1n.","Nincs maxim\xE1lis v\xE1rakoz\xE1si id\u0151 FVG-n\xE9l; csak a 40-es z\xF3nalimit t\xF6rli a legr\xE9gebbieket.","C\xEDmk\xE9k: FVG+ / FVG- (formation), pont (touch), FVG REJ, FVG LONG / FVG SHORT, \xE9s a z\xF3n\xE1n FVG FILLED felirat.","Az FVG esem\xE9nyek NEM r\xE9szei a Radar BUY/SELL score-nak."]},diagram:"fvg-lifecycle",exercise:{prompt:"Az interakt\xEDv \xE9letciklus-dem\xF3ban v\xE1ltsd a Rejection m\xF3dot CE reclaim \u2194 Full zone reclaim, \xE9s az Entry m\xF3dot Close \u2194 Wick k\xF6z\xF6tt.",steps:["Melyik gyerty\xE1n j\xF6n a REJ CE m\xF3dban?","Mi t\xF6rt\xE9nik Full zone m\xF3dban ugyanazzal a gyerty\xE1val?","Wick m\xF3dban kor\xE1bban j\xF6n-e a trigger?"],answer:"Full zone m\xF3dban egy CE f\xF6l\xE9, de a fels\u0151 sz\xE9l al\xE1 z\xE1r\xF3 gyertya csak \xE9rint\xE9s marad; a REJ k\xE9s\u0151bb vagy egy\xE1ltal\xE1n nem j\xF6n. Wick m\xF3dban a trigger kor\xE1bban j\xF6het, mert el\xE9g a rejection high \xE1tsz\xFAr\xE1sa \u2014 t\xF6bb korai \xE9s t\xF6bb hamis jelz\xE9ssel."},quiz:[{id:"l6q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Mi a bullish FVG k\xF3dfelt\xE9tele?",options:["close > high[1]","low > high[2]","high < low[2]","low > low[1]"],correct:1,explanation:"A 3. gyertya low-ja magasabb az 1. gyertya high-j\xE1n\xE1l."},{id:"l6q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mit jelent a narancs pont?",options:["\xDAj bearish FVG","Bearish FVG els\u0151 \xE9rint\xE9se","FVG SHORT trigger","Kit\xF6lt\xF6tt FVG"],correct:1,explanation:"Narancs = bearish z\xF3na first touch; t\xFCrkiz = bullish z\xF3na first touch."},{id:"l6q3",difficulty:"INTERMEDIATE",type:"true_false",prompt:"A rejection \xE9s az entry trigger ugyanazon a gyerty\xE1n is megt\xF6rt\xE9nhet.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. A trigger felt\xE9tele: bar_index > rejectBar \u2014 csak egy k\xE9s\u0151bbi gyertya lehet."},{id:"l6q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Full zone reclaim m\xF3dban mikor REJ egy bullish FVG?",options:["close > CE","close > fels\u0151 sz\xE9l","low < als\xF3 sz\xE9l","high > fels\u0151 sz\xE9l"],correct:1,explanation:"A szigor\xFAbb m\xF3d a z\xF3na t\xFAls\xF3 (fels\u0151) sz\xE9le f\xF6l\xF6tti z\xE1r\xE1st k\xE9ri."},{id:"l6q5",difficulty:"EXPERT",type:"multiple_choice",prompt:"Egy gyertya low-ja a bullish z\xF3na als\xF3 sz\xE9le al\xE1 megy, de a CE f\xF6l\xF6tt z\xE1r. Mi lesz az \xE1llapot?",options:["REJECTED","TOUCHED","FILLED","ENTRY"],correct:2,explanation:"A fill els\u0151bbs\xE9get \xE9lvez: low \u2264 als\xF3 sz\xE9l \u2192 \xE1llapot 4."}],requires:["order-blocks"]},{slug:"trendlines",level:7,tier:"INTERMEDIATE",title:"Trendvonalak \xE9s a v1.7 meger\u0151s\xEDtett t\xF6r\xE9s",titleEn:"Trendlines",summary:"T\xE1masz, ellen\xE1ll\xE1s, t\xF6r\xE9s, hamis kit\xF6r\xE9s, retest \u2014 \xE9s a v1.7 n\xE9gyl\xE9pcs\u0151s \xE1llapotg\xE9pe: valid slope \u2192 BRK \u2192 RETEST \u2192 CONF.",terms:["Support trendline","Resistance trendline","Ascending trendline","Descending trendline","Pivot high","Pivot low","Trendline slope","Trendline break","False breakout","Breakout retest","Confirmation candle","Trendline continuation"],sections:{what:"A trendvonal k\xE9t (vagy t\xF6bb) swing pontot \xF6sszek\xF6t\u0151 egyenes. Emelked\u0151 t\xE1masz (ascending support): magasabb m\xE9lypontokon \xE1t. Cs\xF6kken\u0151 ellen\xE1ll\xE1s (descending resistance): alacsonyabb cs\xFAcsokon \xE1t. A meredeks\xE9g (slope) a trend sebess\xE9g\xE9t mutatja.",why:"A trendvonal vizu\xE1lisan \xF6sszefoglalja a trend ritmus\xE1t. A t\xF6r\xE9se azt jelezheti, hogy a kor\xE1bbi \xFCtem megszakadt \u2014 de a vonalak szubjekt\xEDvek, \xE9s az egyszeri \xE1tsz\xFAr\xE1s gyakran hamis.",how:"T\xF6r\xE9s (break): z\xE1r\xE1s a vonal t\xFAloldal\xE1n. Hamis kit\xF6r\xE9s (false breakout): a t\xF6r\xE9s ut\xE1n az \xE1r visszaz\xE1r a vonal m\xF6g\xE9. Breakout retest: a let\xF6rt vonal visszatesztel\xE9se a m\xE1sik oldalr\xF3l. Confirmation candle: a retest ut\xE1ni, az \xFAj ir\xE1nyba z\xE1r\xF3 gyertya.",recognize:"Csak egy\xE9rtelm\u0171, meger\u0151s\xEDtett swingeket k\xF6ss \xF6ssze. N\xE9zd, h\xE1ny \xE9rint\xE9se volt a vonalnak, \xE9s mennyire meredek. A t\xFAl meredek vonal gyakran hamar t\xF6rik, de kev\xE9s jelent\xE9ssel.",whyTraders:"Kit\xF6r\xE9si \xE9s visszateszt-setupokhoz, valamint a trend \u201Eeg\xE9szs\xE9g\xE9nek\u201D vizu\xE1lis k\xF6vet\xE9s\xE9hez.",useful:"Trendv\xE1lt\xE1s korai jelek\xE9nt, m\xE1s meger\u0151s\xEDt\xE9ssel (strukt\xFAra, VWAP) egy\xFCtt.",misleading:"Ugyanarra a chartra k\xE9t ember k\xE9t k\xFCl\xF6nb\xF6z\u0151 vonalat h\xFAz. 1 percen a zaj sok t\xF6r\xE9st okoz. A visszatekint\u0151 chart torz\xEDt: a pivot (\xE9s \xEDgy a vonal) csak k\xE9s\u0151bb v\xE1lt ismertt\xE9.",bullish:"Cs\xF6kken\u0151 ellen\xE1ll\xE1s; k\xE9t egym\xE1st k\xF6vet\u0151 z\xE1r\xE1s a vonal + 0.10 ATR f\xF6l\xF6tt \u2192 TL BRK UP. Az \xE1r visszaj\xF6n 0.20 ATR-en bel\xFCl a t\xF6r\xE9si szinthez \xE9s f\xF6l\xF6tte z\xE1r \u2192 TL RETEST UP. Egy k\xE9s\u0151bbi gyertya a retest high f\xF6l\xE9 z\xE1r \u2192 TL CONF UP.",bearish:"Emelked\u0151 t\xE1masz let\xF6r\xE9se \u2192 TL BRK DN. Ha az \xE1r visszaz\xE1r a szint + puffer f\xF6l\xE9, a pending setup t\xF6rl\u0151dik \u2014 ez a hamis let\xF6r\xE9s esete. Ha retest j\xF6n alulr\xF3l, majd z\xE1r\xE1s a retest low alatt \u2192 TL CONF DN.",reaction:["BRK: ne \xFCld\xF6zd az els\u0151 nagy gyerty\xE1t.","V\xE1rd a retestet 12 baron bel\xFCl; ha nincs, a setup lej\xE1r.","RETEST: jegyezd fel a retest gyertya high/low-j\xE1t.","CONF: ellen\u0151rizd a kontextust (VWAP, EMA100, strukt\xFAra) \xE9s a stopot.","Ha az \xE1r visszaz\xE1r a t\xF6r\xE9si szint m\xF6g\xE9, a setup \xE9rv\xE9nytelen."],mistakes:["Egyszeri kan\xF3cos \xE1tsz\xFAr\xE1st t\xF6r\xE9snek venni.","A BRK gyerty\xE1n bel\xE9pni.","Saj\xE1t vonalat \u201Eigaz\xEDtani\u201D, hogy belef\xE9rjen a setup.","Azt hinni, hogy a r\xE9gi, t\xF6r\xF6lt vonal m\xE9g \xE9rv\xE9nyes."]},godmode:{title:"A v1.7 automatikus trendvonal-rendszer",points:["Pivot length = 3 (bal \xE9s jobb). A vonal a pivot gyerty\xE1t\xF3l indul, de csak 3 bar m\xFAlva ismert.","Cs\xF6kken\u0151 ellen\xE1ll\xE1s CSAK akkor, ha az \xFAj meger\u0151s\xEDtett pivot high alacsonyabb az el\u0151z\u0151n\xE9l; emelked\u0151 t\xE1masz CSAK ha az \xFAj pivot low magasabb. V\xEDzszintes vonalat nem rajzol.","Minden \xFAj pivot high t\xF6rli a r\xE9gi ellen\xE1ll\xE1s-vonalat \xE9s a pending bullish setupot (pivot low ugyan\xEDgy a bearish oldalon).","Break candidate: alapb\xF3l 2 egym\xE1st k\xF6vet\u0151 meger\u0151s\xEDtett z\xE1r\xE1s a vonal \xB1 0.10 ATR pufferen t\xFAl \u2192 TL BRK UP / DN.","Retest: 12 baron bel\xFCl a gyertya range-e a t\xF6r\xE9si szint \xB1 0.20 ATR s\xE1vj\xE1ba \xE9r, \xE9s a close a szint j\xF3 oldal\xE1n van \u2192 TL RETEST UP / DN.","Failure: close a t\xF6r\xE9si szint \u2212 puffer alatt (bull) / + puffer f\xF6l\xF6tt (bear) \u2192 a setup csendben t\xF6rl\u0151dik.","Confirmation (alap: Close beyond retest candle): k\xE9s\u0151bbi close a retest high f\xF6l\xF6tt / low alatt \u2192 TL CONF UP / DN. Wick m\xF3dban el\xE9g a high/low t\xF6r\xE9se.","A retest ut\xE1ni meger\u0151s\xEDt\xE9sre \xFAjabb 12 bar a limit.","Fontos k\xF3dr\xE9szlet: a pending setup csak akkor j\xF6n l\xE9tre, ha a \u201EShow break / retest / confirmation labels\u201D be van kapcsolva \u2014 ha kikapcsolod, az \xE1llapotg\xE9p \xE9s az alertek sem futnak."]},diagram:"trendline-demo",exercise:{prompt:"A dem\xF3ban hasonl\xEDtsd \xF6ssze a hamis \xE9s a meger\u0151s\xEDtett bearish t\xF6r\xE9st.",steps:["Hol jelenik meg a TL BRK DN mindkett\u0151ben?","Mi t\xF6rli a setupot a hamis v\xE1ltozatban?","Melyik gyertya adja a TL CONF DN-t a val\xF3diban?"],answer:"Mindkett\u0151 2 z\xE1r\xE1ssal a puffer alatt indul. A hamis v\xE1ltozatban egy z\xE1r\xE1s a t\xF6r\xE9si szint + 0.10 ATR f\xF6l\xE9 t\xF6rli a pending setupot. A val\xF3diban a retest ut\xE1n egy k\xE9s\u0151bbi z\xE1r\xE1s a retest gyertya low-ja alatt adja a CONF-ot."},quiz:[{id:"l7q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"H\xE1ny egym\xE1st k\xF6vet\u0151 z\xE1r\xE1s kell alapb\xF3l a TL BRK-hoz?",options:["1","2","3","5"],correct:1,explanation:"autoTlBreakBars = 2."},{id:"l7q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mi a retest tolerancia alap\xE9rt\xE9ke?",options:["0.10 ATR","0.20 ATR","0.5 ATR","1 tick"],correct:1,explanation:"autoTlRetestTolAtr = 0.20."},{id:"l7q3",difficulty:"BEGINNER",type:"true_false",prompt:"A TL BRK DN azt jelenti, hogy a teljes bearish sorozat meger\u0151s\xEDt\xE9st nyert.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Csak a TL CONF DN jelzi a teljes BRK \u2192 RETEST \u2192 CONF sorozatot."},{id:"l7q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mikor rajzol a v1.7 cs\xF6kken\u0151 ellen\xE1ll\xE1st?",options:["B\xE1rmely k\xE9t pivot high-b\xF3l","Ha az \xFAj pivot high alacsonyabb az el\u0151z\u0151n\xE9l","Ha az \xFAj pivot high magasabb","A napi cs\xFAcsb\xF3l"],correct:1,explanation:"autoLastHighPrice < autoPrevHighPrice."},{id:"l7q5",difficulty:"EXPERT",type:"multiple_choice",prompt:"Mi t\xF6rt\xE9nik a pending bullish setuppal, ha \xFAj pivot high \xE9rkezik?",options:["Megmarad","T\xF6rl\u0151dik \xE9s a vonal \xFAjra\xE9p\xFCl","Automatikusan meger\u0151s\xEDt\xE9st kap","\xC1tv\xE1lt bearishre"],correct:1,explanation:"Az \xFAj pivot high blokk minden pendingBullTl v\xE1ltoz\xF3t resetel."}],requires:["fair-value-gaps"]},{slug:"moving-averages",level:8,tier:"INTERMEDIATE",title:"Mozg\xF3\xE1tlagok: az \xF6t GODMODE EMA \xE9s a lila vonal",titleEn:"Moving averages",summary:"SMA vs. EMA, keresztez\xE9sek, stacking, dinamikus t\xE1masz, meredeks\xE9g, kompresszi\xF3 \u2014 \xE9s mi\xE9rt nem k\xE9t meger\u0151s\xEDt\xE9s az EMA 50 \xE9s a lila vonal.",terms:["Simple Moving Average","Exponential Moving Average","EMA crossover","EMA stacking","Dynamic support","Dynamic resistance","Moving average slope","Moving average compression","Trend alignment"],sections:{what:"A mozg\xF3\xE1tlag (moving average) az utols\xF3 N z\xE1r\xF3\xE1r \xE1tlaga. SMA: egyszer\u0171 sz\xE1mtani \xE1tlag. EMA: exponenci\xE1lis s\xFAlyoz\xE1s, a frissebb \xE1rak nagyobb s\xFAlyt kapnak (\u03B1 = 2/(N+1)), ez\xE9rt gyorsabban reag\xE1l.",why:"Kisim\xEDtja a zajt, \xE9s megmutatja az \xE1tlagos \xE1rat k\xFCl\xF6nb\xF6z\u0151 id\u0151t\xE1vokon. T\xF6bb \xE1tlag sorrendje a r\xF6vid \xE9s hosszabb t\xE1v\xFA lend\xFClet viszony\xE1t mutatja.",how:"EMA_t = \u03B1\xB7close_t + (1\u2212\u03B1)\xB7EMA_{t\u22121}. EMA stacking: bullish stack, ha a gyorsabbak a lassabbak f\xF6l\xF6tt vannak (9 > 21 > 50 > 70 > 100). Kompresszi\xF3: az \xE1tlagok \xF6sszefon\xF3dnak \u2014 bizonytalan ir\xE1ny. Meredeks\xE9g: emelked\u0151 vagy es\u0151 \xE1tlag.",recognize:"Rendezett, legyez\u0151szer\u0171en sz\xE9tny\xEDl\xF3 EMA-k = trend. \xD6sszegabalyod\xF3 vonalak = range. Az \xE1r visszah\xFAz\xF3d\xE1sa az EMA 21 / 50 fel\xE9 egy trendben gyakran ad visszateszt-lehet\u0151s\xE9get.",whyTraders:"Gyors, objekt\xEDv trendsz\u0171r\u0151 \xE9s dinamikus referenciaszint.",useful:"Trendes napokon a trend ir\xE1ny\xE1nak \xE9s erej\xE9nek meg\xEDt\xE9l\xE9s\xE9re.",misleading:"K\xE9sik: a keresztez\xE9s gyakran a mozg\xE1s nagy r\xE9sze ut\xE1n j\xF6n. Oldalaz\xE1sban folyamatos hamis keresztez\xE9sek. Az EMA nem \u201Efal\u201D: a reakci\xF3 nem garant\xE1lt.",bullish:"9 > 21 > 50 > 70 > 100, mind emelkednek; az \xE1r visszah\xFAz\xF3dik az EMA 21-ig \xE9s bullish rejection gyerty\xE1val z\xE1r.",bearish:"Teljes bearish stack, az \xE1r fel\xFClr\u0151l tesztel egy lefel\xE9 d\u0151l\u0151 EMA 50-et \xE9s alatta z\xE1r.",reaction:["Olvasd a sorrendet: stack vagy \xF6sszefon\xF3d\xE1s?","N\xE9zd a meredeks\xE9get.","Trendben az EMA-visszatesztet kontextusnak, ne triggernek haszn\xE1ld.","\xD6sszefon\xF3d\xE1sn\xE1l cs\xF6kkentsd a setupok sz\xE1m\xE1t."],mistakes:["Minden keresztez\xE9st jelnek venni.","Az EMA 50-et \xE9s a lila vonalat (alapb\xF3l szint\xE9n EMA 50) k\xE9t k\xFCl\xF6n meger\u0151s\xEDt\xE9snek sz\xE1molni.","T\xFAl sok \xE1tlagot n\xE9zni \xE9s egyiket sem \xE9rteni."]},godmode:{title:"EMA rendszer \xE9s a Purple Trend Line a k\xF3dban",points:["\xD6t EMA close forr\xE1sb\xF3l: 9 (t\xFCrkiz #26C6DA), 21 (k\xE9k #42A5F5), 50 (narancs #FFA726), 70 (piros #EF5350), 100 (vil\xE1gossz\xFCrke #B0BEC5, 2-es vastags\xE1g).","emaScore = a helyesen rendezett (gyorsabb > lassabb) p\xE1rok ar\xE1nya \xD7 100. 5 EMA = 10 p\xE1r. 100 = t\xF6k\xE9letes bull stack, 0 = t\xF6k\xE9letes bear stack.","Dashboard: BULLISH (\u226599.9), BEARISH (\u22640.1), BULL BIAS (>60), BEAR BIAS (<40), egy\xE9bk\xE9nt MIXED.","Purple Trend Line: k\xFCl\xF6n mozg\xF3\xE1tlag, alap EMA 50 a close-b\xF3l, vastag lila (#E040FB). T\xEDpus: EMA/SMA/WMA/RMA/HMA.","tlScore: close a vonal felett \xE9s a vonal emelkedik = 100; felett, de esik = 75; alatt, de emelkedik = 25; alatt \xE9s esik = 0.","A Ribbon + TL komponens = 0.65\xB7ribScore + 0.35\xB7tlScore (20-as s\xFAly).","Alapbe\xE1ll\xEDt\xE1sban az EMA 3 \xE9s a lila vonal ugyanazt az \xE9rt\xE9ket rajzolja \u2014 ez nem k\xE9t f\xFCggetlen meger\u0151s\xEDt\xE9s."]},diagram:"ema-speeds",exercise:{prompt:"Az interakt\xEDv grafikonon kapcsold ki egyes\xE9vel az EMA-kat, \xE9s figyeld meg az emaScore v\xE1ltoz\xE1s\xE1t.",steps:["Mennyi p\xE1r van 5 EMA-n\xE1l? \xC9s 3-n\xE1l?","Mi az emaScore, ha csak az EMA 9 > EMA 21 igaz, a t\xF6bbi p\xE1r ford\xEDtott?"],answer:"5 EMA = 10 p\xE1r, 3 EMA = 3 p\xE1r. Ha 10-b\u0151l csak 1 p\xE1r rendezett: emaScore = 10 \u2192 BEAR BIAS."},quiz:[{id:"l8q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Mi\xE9rt reag\xE1l gyorsabban az EMA az SMA-n\xE1l?",options:["R\xF6videbb","A frissebb \xE1rak nagyobb s\xFAlyt kapnak","Volume-ot haszn\xE1l","Nem reag\xE1l gyorsabban"],correct:1,explanation:"Exponenci\xE1lis s\xFAlyoz\xE1s."},{id:"l8q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mennyi az emaScore t\xF6k\xE9letes bullish stackn\xE9l?",options:["50","80","100","10"],correct:2,explanation:"Minden p\xE1r rendezett \u2192 100."},{id:"l8q3",difficulty:"INTERMEDIATE",type:"true_false",prompt:"Az EMA 50 \xE9s a Purple Trend Line alapb\xF3l k\xE9t f\xFCggetlen meger\u0151s\xEDt\xE9s.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Alapb\xF3l mindkett\u0151 EMA 50 close-b\xF3l."},{id:"l8q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"tlScore, ha az \xE1r a lila vonal alatt van, de a vonal emelkedik?",options:["0","25","75","100"],correct:1,explanation:"close < trendLine \xE9s tlRising \u2192 25."}],requires:["trendlines"]},{slug:"trend-ribbon",level:9,tier:"INTERMEDIATE",title:"Trend Ribbon",titleEn:"Trend ribbon",summary:"K\xE9tszer sim\xEDtott b\xE1zis, ATR s\xE1v, meredeks\xE9g \xE9s a perzisztens trend\xE1llapot, amely nem v\xE1lt egyetlen gyerty\xE1ra.",terms:["Ribbon basis","ATR band","Smoothing","Trend slope","Bullish state","Bearish state","Neutral state","Trend confirmation bars"],sections:{what:"A Trend Ribbon egy sim\xEDtott b\xE1zisvonal \xE9s k\xF6r\xFCl\xF6tte egy ATR-ar\xE1nyos s\xE1v. A sz\xEDne a perzisztens trend\xE1llapotot mutatja: z\xF6ld (BULLISH), piros (BEARISH), s\xE1rga (NEUTRAL).",why:"A c\xE9l egy nyugodt, nem villog\xF3 trendk\xF6rnyezet-jelz\u0151: a s\xE1v sz\xE9less\xE9ge alkalmazkodik a volatilit\xE1shoz, a sz\xEDn csak meger\u0151s\xEDt\xE9s ut\xE1n v\xE1lt.",how:"ribRaw = EMA(HLC3, 34); ribBasis = EMA(ribRaw, 5) \u2014 k\xE9tszer sim\xEDtva. F\xE9lsz\xE9less\xE9g = ATR(14) \xD7 1.2. Upper = basis + f\xE9lsz\xE9less\xE9g, lower = basis \u2212 f\xE9lsz\xE9less\xE9g. Meredeks\xE9g = (basis \u2212 basis[3]) / ATR. pricePos = (close \u2212 basis) / ATR.",recognize:"Z\xF6ld, emelked\u0151 b\xE1zis, az \xE1r a s\xE1v fels\u0151 fel\xE9ben: er\u0151s bullish k\xF6rnyezet. Az \xE1r a s\xE1v k\xF6zep\xE9n csapkod, a b\xE1zis lapos: tiszt\xE1zatlan k\xF6rnyezet.",whyTraders:"Gyors vizu\xE1lis v\xE1lasz arra, hogy melyik oldal fel\xE9 \xE9rdemes setupot keresni.",useful:"Trendir\xE1ny\xFA sz\u0171r\u0151k\xE9nt \xE9s a trend\xE1llapot v\xE1ltoz\xE1s\xE1nak figyel\xE9s\xE9re.",misleading:"A ribbon k\xE9sik (k\xE9t sim\xEDt\xE1s). V-alak\xFA fordul\xF3kn\xE1l k\xE9s\u0151n v\xE1lt. A s\xE1v nem stop- vagy c\xE9lz\xF3na.",bullish:"close > basis, EMA 9 > EMA 50, pozit\xEDv meredeks\xE9g, RSI > 50 k\xE9t egym\xE1st k\xF6vet\u0151 gyerty\xE1n \u2192 BULLISH (z\xF6ld).",bearish:"Az el\u0151z\u0151 felt\xE9telek ellent\xE9te k\xE9t gyerty\xE1n \u2192 BEARISH (piros).",reaction:["A sz\xEDn a kontextus, nem a trigger.","Z\xF6ld + emelked\u0151 b\xE1zis: long setupokat r\xE9szes\xEDtsd el\u0151nyben.","Piros + es\u0151 b\xE1zis: short oldal.","Csapkod\xE1s a s\xE1v k\xF6zep\xE9n: v\xE1rj strukt\xFAr\xE1ra \xE9s z\xF3nareakci\xF3ra."],mistakes:["Sz\xEDnv\xE1lt\xE1skor azonnal bel\xE9pni.","A s\xE1v sz\xE9leit stop/c\xE9l szintnek haszn\xE1lni.","Elfelejteni, hogy a NEUTRAL csak hosszabb oldalaz\xE1s ut\xE1n j\xF6n."]},godmode:{title:"Trend\xE1llapot-g\xE9p a k\xF3dban",points:["bullRaw = close > ribBasis \xC9S EMA9 > EMA50 \xC9S ribSlope > 0 \xC9S RSI > 50; bearRaw az ellent\xE9te.","trendConfBars = 2: ennyi egym\xE1st k\xF6vet\u0151 bullRaw/bearRaw kell a v\xE1lt\xE1shoz.","NEUTRAL: ha legal\xE1bb 6 (2\xD73) egym\xE1st k\xF6vet\u0151 bar se bull, se bear \xC9S |pricePos| < 0.5 ATR.","ribScore = 50 + trendState\xB720 + clamp(pricePos\xB715, \xB115) + clamp(ribSlope\xB730, \xB115).","Sz\xEDn: z\xF6ld #00E676, piros #FF1744, s\xE1rga #FFC400; bullish \xE1llapotban az als\xF3 sz\xE9l #D4FF00 akcentussal.","A Radar \u201ETrend\u201D sora ezt a perzisztens \xE1llapotot mutatja; trendv\xE1lt\xE1skor unified alert is k\xE9sz\xFCl."]},diagram:"ribbon",exercise:{prompt:"Az interakt\xEDv ribbon-dem\xF3ban \xE1ll\xEDtsd a Trend confirmation bars \xE9rt\xE9ket 1 \xE9s 4 k\xF6z\xF6tt.",steps:["H\xE1nyszor v\xE1lt a sz\xEDn 1-n\xE9l?","\xC9s 4-n\xE9l?","Mi az \xE1ra a kevesebb v\xE1lt\xE1snak?"],answer:"Alacsonyabb \xE9rt\xE9kn\xE9l t\xF6bb (gyakran hamis) v\xE1lt\xE1s, magasabbn\xE1l kevesebb, de k\xE9s\u0151bbi. Ez a reakci\xF3id\u0151 \xE9s a zajsz\u0171r\xE9s k\xF6zti alku."},quiz:[{id:"l9q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mi a Ribbon alap\xE9rtelmezett forr\xE1sa?",options:["close","HLC3","OHLC4","volume"],correct:1,explanation:"ribSrc = hlc3."},{id:"l9q2",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"H\xE1ny bar kell alapb\xF3l a trendv\xE1lt\xE1shoz?",options:["1","2","3","6"],correct:1,explanation:"trendConfBars = 2."},{id:"l9q3",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Melyik NEM r\xE9sze a bullRaw felt\xE9telnek?",options:["close > basis","EMA9 > EMA50","MACD > signal","RSI > 50"],correct:2,explanation:"A MACD nem r\xE9sze a ribbon trend\xE1llapot\xE1nak."},{id:"l9q4",difficulty:"BEGINNER",type:"true_false",prompt:"A ribbon s\xE1vj\xE1nak sz\xE9lei stop szintek.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Trendk\xF6rnyezet, nem stop/target z\xF3na."}],requires:["moving-averages"]},{slug:"vwap",level:10,tier:"INTERMEDIATE",title:"VWAP \u2014 a forgalommal s\xFAlyozott \xE1tlag\xE1r",titleEn:"Volume weighted average price",summary:"Session VWAP, typical price, s\xFAlyoz\xE1s, meredeks\xE9g, reclaim \xE9s mi\xE9rt nem r\xE9sze a VWAP a Radar score-nak.",terms:["VWAP","Session VWAP","Typical price","Volume weighting","VWAP slope","VWAP retest","Dynamic reference level"],sections:{what:"A VWAP (Volume Weighted Average Price) a session eleje \xF3ta kereskedett \xF6sszes kontraktus \xE1tlag\xE1ra, a forgalommal s\xFAlyozva. Typical price = (high + low + close) / 3.",why:"Megmutatja, hogy az \xE1tlagos r\xE9sztvev\u0151 a nap sor\xE1n milyen \xE1ron vett/adott el. Sok v\xE9grehajt\xF3 algoritmus \xE9s intraday keresked\u0151 referenci\xE1nak haszn\xE1lja.",how:"VWAP = \u03A3(typical price \xD7 volume) / \u03A3 volume, a session kezdet\xE9t\u0151l \xF6sszegezve, minden \xFAj sessionn\xE9l null\xE1r\xF3l. A nagy forgalm\xFA gyerty\xE1k jobban h\xFAzz\xE1k.",recognize:"VWAP felett tart\xF3s \xE1r: intraday vev\u0151i t\xFAls\xFAly lehet. Alatta: elad\xF3i. Ism\xE9telt keresztez\xE9sek: egyens\xFAly / chop. Nagy t\xE1vols\xE1g: t\xFAlny\xFAjtott \xE1r.",whyTraders:"Gyors kontextus-sz\u0171r\u0151 \xE9s gyakran figyelt reakci\xF3s ter\xFClet.",useful:"Trendes napokon VWAP-visszatesztn\xE9l; reclaim (visszaszerz\xE9s) eset\xE9n ir\xE1nyv\xE1lt\xE1s kontextusak\xE9nt.",misleading:"A session elej\xE9n kev\xE9s adatb\xF3l sz\xE1mol, nagyon mozog. Rendk\xEDv\xFCli forgalm\xFA h\xEDrgyerty\xE1k torz\xEDtj\xE1k. Range napokon az \xE1r \xFAjra \xE9s \xFAjra keresztezi \u2014 ilyenkor jelent\xE9se kicsi. Nem automatikus t\xE1masz.",bullish:"Az \xE1r a VWAP al\xE1 esik, majd visszaszerzi, \xE9s egy VWAP-visszateszt felette tart (bullish rejection). Kontextus: long oldal.",bearish:"Az \xE1r elutas\xEDt\xE1st kap alulr\xF3l a VWAP-n\xE1l, a VWAP lejt, az EMA-k alatta vannak.",reaction:["VWAP felett: long setupokat r\xE9szes\xEDts el\u0151nyben, de v\xE1rj z\xF3n\xE1ra/strukt\xFAr\xE1ra.","VWAP alatt: short oldal.","Ism\xE9telt keresztez\xE9s: cs\xF6kkentsd az aktivit\xE1st.","Nagy t\xE1vols\xE1g: ne \xFCld\xF6zz, ne is felt\xE9telezz azonnali visszat\xE9r\xE9st."],mistakes:["A VWAP \xE9rint\xE9s\xE9t fordul\xF3nak hinni.","Minden keresztez\xE9st jelnek venni.","A session eleji VWAP-ot ugyan\xFAgy kezelni, mint a nap k\xF6zep\xE9n."]},godmode:{title:"VWAP a v1.7-ben",points:["ta.vwap(HLC3) \u2014 a TradingView session VWAP, a chart szimb\xF3lum session-defin\xEDci\xF3j\xE1t k\xF6veti (CME futures: 18:00 ET nyit\xE1s).","Vastag s\xE1rga vonal (#FFCA28), csak intraday charton.","NINCS benne a Radar BUY/SELL score s\xFAlyoz\xE1s\xE1ban \u2014 k\xFCl\xF6n kontextus.","A Visual Diagnostics panel \u201EVWAP: ACTIVE / NO DATA\u201D sora mutatja, van-e adat.","Az Akad\xE9mia szimul\xE1tora a VWAP-ot 18:00 ET-kor reseteli, ami a CME session kezdete."]},diagram:"vwap-compare",exercise:{prompt:"Hasonl\xEDtsd \xF6ssze a VWAP-ot az EMA 50-nel \xE9s EMA 100-zal az interakt\xEDv charton.",steps:["Melyik reag\xE1l a nagy forgalm\xFA gyerty\xE1kra a legjobban?","Mi\xE9rt lapos a VWAP k\xE9s\u0151 d\xE9lut\xE1n?"],answer:"A VWAP a forgalmat s\xFAlyozza, ez\xE9rt a nagy forgalm\xFA gyerty\xE1k h\xFAzz\xE1k. K\xE9s\u0151 d\xE9lut\xE1n m\xE1r sok forgalom halmoz\xF3dott fel, egy \xFAjabb gyertya kis s\xFAlyt kap \u2014 a VWAP lassul."},quiz:[{id:"l10q1",difficulty:"BEGINNER",type:"multiple_choice",prompt:"Mi a typical price?",options:["(O+C)/2","(H+L+C)/3","(H+L)/2","C"],correct:1,explanation:"HLC3."},{id:"l10q2",difficulty:"INTERMEDIATE",type:"true_false",prompt:"A VWAP r\xE9sze a GODMODE BUY score-nak.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. K\xFCl\xF6n chart-kontextus."},{id:"l10q3",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mikor kev\xE9sb\xE9 megb\xEDzhat\xF3 a VWAP?",options:["Trendes napon","Session elej\xE9n \xE9s range napokon","NY d\xE9lben","Soha"],correct:1,explanation:"Kev\xE9s adat a session elej\xE9n; range-ben sok keresztez\xE9s."},{id:"l10q4",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mit jelent a VWAP reclaim?",options:["Az \xE1r visszaszerzi \xE9s f\xF6l\xF6tte tart","Az \xE1r keresztezi","A VWAP lapos","Volume cs\xFAcs"],correct:0,explanation:"A reclaim: al\xE1 es\xE9s ut\xE1n visszat\xE9r\xE9s \xE9s megtart\xE1s."}],requires:["trend-ribbon"]}];var ja=[{slug:"rsi",level:11,tier:"ADVANCED",title:"RSI \xE9s a GODMODE momentum score",titleEn:"Relative Strength Index",summary:"RSI sz\xE1m\xEDt\xE1s, 50-es vonal, t\xFAlvett/t\xFAladott, divergencia \u2014 \xE9s a k\xF3d saj\xE1t, meredeks\xE9ggel er\u0151s\xEDtett RSI score-ja.",terms:["RSI","RSI 50 line","Overbought","Oversold","Momentum","RSI divergence","Bullish divergence","Bearish divergence","RSI slope"],sections:{what:"Az RSI (Relative Strength Index) 0\u2013100 k\xF6z\xF6tti momentum-oszcill\xE1tor: az \xE1tlagos emelked\u0151 \xE9s es\u0151 z\xE1r\xF3\xE1r-v\xE1ltoz\xE1sok ar\xE1ny\xE1t m\xE9ri.",why:"Megmutatja, mennyire egyoldal\xFA volt az ut\xF3bbi mozg\xE1s. A 50 f\xF6l\xF6tti \xE9rt\xE9k azt jelenti, hogy az \xE1tlagos emelked\xE9sek nagyobbak voltak az es\xE9sekn\xE9l.",how:"RS = RMA(emelked\xE9sek, 14) / RMA(es\xE9sek, 14); RSI = 100 \u2212 100 / (1 + RS). T\xFAlvett (overbought): hagyom\xE1nyosan 70 f\xF6l\xF6tt; t\xFAladott (oversold): 30 alatt. Divergencia: az \xE1r \xFAj cs\xFAcsot \xE9r el, az RSI nem (bearish divergencia) \u2014 vagy ford\xEDtva (bullish).",recognize:"Trendben az RSI sok\xE1ig 50 felett (vagy alatt) marad. A divergencia a momentum gyeng\xFCl\xE9s\xE9t jelezheti.",whyTraders:"Momentum-meger\u0151s\xEDt\xE9shez \xE9s a t\xFAlny\xFAjtott mozg\xE1sok felismer\xE9s\xE9hez.",useful:"A trend ir\xE1ny\xE1nak momentum-meger\u0151s\xEDt\xE9sek\xE9nt (RSI > 50 long kontextusban).",misleading:"Er\u0151s trendben a t\xFAlvett \xE1llapot napokig/\xF3r\xE1kig tarthat; a \u201E70 f\xF6l\xF6tt eladok\u201D szab\xE1ly trendben dr\xE1ga. A divergencia gyakran t\xF6bbsz\xF6r ism\xE9tl\u0151dik, miel\u0151tt b\xE1rmi t\xF6rt\xE9nne.",bullish:"Az RSI 50 f\xF6l\xE9 emelkedik \xE9s emelkedik (pozit\xEDv 3 gyerty\xE1s meredeks\xE9g) egy bullish strukt\xFAr\xE1ban.",bearish:"Az \xE1r magasabb cs\xFAcsot \xE9r el, az RSI alacsonyabbat: bearish divergencia \u2014 figyelmeztet\xE9s, nem short jel.",reaction:["Az RSI-t ne haszn\xE1ld \xF6n\xE1ll\xF3 bel\xE9p\xE9sre.","Trendben a t\xFAlvett/t\xFAladott ink\xE1bb er\u0151t jelez.","Divergencia: lass\xEDts, v\xE1rj strukt\xFArav\xE1lt\xE1sra."],mistakes:["Ellentrend-trade minden t\xFAlvett \xE9rt\xE9kn\xE9l.","Divergenci\xE1t triggernek venni.","Az RSI score-t az RSI \xE9rt\xE9k\xE9vel \xF6sszekeverni."]},godmode:{title:"RSI a k\xF3dban (10-es s\xFAly)",points:["RSI(14) close-b\xF3l; rsiSlope = RSI \u2212 RSI[3].","rsiScore = clamp(50 + (RSI \u2212 50)\xB71.6 + rsiSlope\xB71.5, 0, 100).","Dashboard \u201EMomentum\u201D: rsiScore \u2265 65 BULLISH, \u2264 35 BEARISH, egy\xE9bk\xE9nt NEUTRAL.","P\xE9lda: RSI 60, slope +4 \u2192 50 + 16 + 6 = 72 \u2192 BULLISH.","A GODMODE panel MOMENTUM sora rsiScore-t mutat (ha az RSI ki van kapcsolva, macdScore-t).","Az RSI > 50 a ribbon trend\xE1llapot-felt\xE9tel\xE9ben is szerepel."]},diagram:"rsi-panel",exercise:{prompt:"Sz\xE1mold ki a rsiScore-t: RSI = 44, RSI 3 gyerty\xE1val ezel\u0151tt = 52.",steps:["slope = \u22128","50 + (\u22126)\xB71.6 + (\u22128)\xB71.5"],answer:"50 \u2212 9.6 \u2212 12 = 28.4 \u2192 BEARISH momentum a dashboardon, b\xE1r maga az RSI 44, nem 30 alatt."},quiz:[{id:"l11q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"RSI 60, slope 0 \u2014 mennyi a rsiScore?",options:["60","66","50","72"],correct:1,explanation:"50 + 10\xB71.6 = 66."},{id:"l11q2",difficulty:"BEGINNER",type:"true_false",prompt:"70 feletti RSI er\u0151s trendben azonnali short jel.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Trendben a t\xFAlvett \xE1llapot sok\xE1ig tarthat."},{id:"l11q3",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mikor BULLISH a dashboard Momentum sora?",options:["RSI \u2265 70","rsiScore \u2265 65","RSI > 50","MACD > signal"],correct:1,explanation:"rsiState a rsiScore alapj\xE1n."}],requires:["vwap"]},{slug:"macd",level:12,tier:"ADVANCED",title:"MACD \xE9s a directional score",titleEn:"MACD",summary:"MACD vonal, signal, hisztogram, keresztez\xE9s, expanzi\xF3 \u2014 \xE9s a k\xF3d ATR-normaliz\xE1lt MACD score-ja.",terms:["MACD line","Signal line","Histogram","Zero line","Bullish crossover","Bearish crossover","Histogram expansion","Momentum weakening","Divergence"],sections:{what:"A MACD (Moving Average Convergence Divergence) k\xE9t EMA k\xFCl\xF6nbs\xE9ge: MACD = EMA12 \u2212 EMA26. A signal vonal ennek 9-es EMA-ja. A hisztogram = MACD \u2212 signal.",why:"A r\xF6vid \xE9s hosszabb lend\xFClet k\xFCl\xF6nbs\xE9g\xE9t \xE9s annak v\xE1ltoz\xE1s\xE1t mutatja: gyorsul vagy lassul a mozg\xE1s.",how:"Bullish crossover: MACD a signal f\xF6l\xE9 l\xE9p. Hisztogram-expanzi\xF3: a hisztogram abszol\xFAt \xE9rt\xE9ke n\u0151 \u2192 a momentum er\u0151s\xF6dik. Zero line: MACD > 0 azt jelenti, hogy az EMA12 az EMA26 felett van.",recognize:"N\xF6vekv\u0151 z\xF6ld hisztogram = gyorsul\xF3 emelked\xE9s; cs\xF6kken\u0151 = lassul\xE1s, m\xE9g ha pozit\xEDv is.",whyTraders:"Momentum-meger\u0151s\xEDt\xE9s \xE9s a lassul\xE1s korai \xE9szlel\xE9se.",useful:"Trend-folytat\xE1s meger\u0151s\xEDt\xE9s\xE9re \xE9s a lend\xFClet gyeng\xFCl\xE9s\xE9nek jelz\xE9s\xE9re.",misleading:"K\xE9sik, range-ben sok keresztez\xE9s. A hisztogram-zsugorod\xE1s nem fordulat, csak lassul\xE1s.",bullish:"MACD > signal, a hisztogram pozit\xEDv \xE9s n\u0151.",bearish:"MACD \u2264 signal, a hisztogram negat\xEDv \xE9s m\xE9ly\xFCl.",reaction:["MACD-t ne haszn\xE1ld \xF6n\xE1ll\xF3 triggerk\xE9nt.","Ha a trend bullish, de a MACD bearish: lehet csak lassul\xE1s \u2014 nem felt\xE9tlen ellentmond\xE1s.","A hisztogram-expanzi\xF3 er\u0151s\xEDtheti a megl\xE9v\u0151 setup kontextus\xE1t."],mistakes:["Minden keresztez\xE9sre kereskedni.","A hisztogram cs\xF6kken\xE9s\xE9t fordul\xF3nak venni.","A MACD-t \xE9s az EMA-kat f\xFCggetlen inform\xE1ci\xF3nak hinni (mindkett\u0151 EMA)."]},godmode:{title:"MACD score a k\xF3dban (10-es s\xFAly)",points:["Param\xE9terek: 12 / 26 / 9, close.","histNorm = hisztogram / ATR; histExpand = |hist| > |hist[1]|.","macdScore = clamp(50 \xB1 20 (MACD a signal felett/alatt) + clamp(histNorm\xB740, \xB120) + (expanzi\xF3 eset\xE9n \xB110 a hisztogram el\u0151jele szerint), 0, 100).","Dashboard MACD: BULLISH ha MACD > signal, k\xFCl\xF6nben BEARISH (nincs NEUTRAL).","Az ATR-rel normaliz\xE1l\xE1s miatt ugyanakkora hisztogram nyugodt piacon t\xF6bbet sz\xE1m\xEDt."]},diagram:"macd-panel",exercise:{prompt:"MACD > signal, hist = 2, ATR = 10, a hisztogram n\u0151. Sz\xE1mold ki a macdScore-t.",steps:["+20","histNorm = 0.2 \u2192 0.2\xB740 = 8","expanzi\xF3 pozit\xEDv hisztogrammal +10"],answer:"50 + 20 + 8 + 10 = 88."},quiz:[{id:"l12q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Mi a hisztogram?",options:["EMA12 \u2212 EMA26","MACD \u2212 signal","Signal \u2212 0","Volume"],correct:1,explanation:"A MACD \xE9s a signal k\xFCl\xF6nbs\xE9ge."},{id:"l12q2",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Mennyi a macdScore maxim\xE1lis hozz\xE1j\xE1rul\xE1sa a hisztogram nagys\xE1g\xE1b\xF3l?",options:["\xB110","\xB120","\xB140","\xB150"],correct:1,explanation:"clamp(histNorm\xB740, \u221220, 20)."},{id:"l12q3",difficulty:"INTERMEDIATE",type:"true_false",prompt:"A dashboard MACD sora mutathat NEUTRAL-t.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis: csak BULLISH vagy BEARISH."}],requires:["rsi"]},{slug:"atr-volatility",level:13,tier:"ADVANCED",title:"ATR \xE9s volatilit\xE1s",titleEn:"Average True Range and volatility",summary:"True range, ATR, expanzi\xF3/kontrakci\xF3, a volRatio \xE9s mi\xE9rt blokkolja a GODMODE a jelz\xE9seket alacsony volatilit\xE1sban.",terms:["Average True Range","True range","Volatility","Volatility expansion","Volatility contraction","ATR stop distance","ATR normalization"],sections:{what:"A True Range a gyertya teljes mozg\xE1sa, bele\xE9rtve az el\u0151z\u0151 z\xE1r\xF3\xE1rt\xF3l val\xF3 gapet: max(H\u2212L, |H\u2212C\u208B\u2081|, |L\u2212C\u208B\u2081|). Az ATR ennek sim\xEDtott (RMA) \xE1tlaga. Ir\xE1nyt nem jelez, csak m\xE9retet.",why:"A stopok, c\xE9lok \xE9s poz\xEDci\xF3m\xE9ret \xE9rtelmez\xE9s\xE9hez tudnod kell, mekkora a szok\xE1sos mozg\xE1s most. 10 pont nyugodt piacon sok, h\xEDres reggelen kev\xE9s.",how:"ATR(14) = RMA(TR, 14). Expanzi\xF3: az ATR n\u0151 (a gyerty\xE1k nagyobbak). Kontrakci\xF3: cs\xF6kken. ATR-normaliz\xE1l\xE1s: egy t\xE1vols\xE1got ATR egys\xE9gben fejez\xFCnk ki (pl. az \xE1r 1.5 ATR-re van a b\xE1zist\xF3l), \xEDgy k\xFCl\xF6nb\xF6z\u0151 napok \xF6sszehasonl\xEDthat\xF3k.",recognize:"Kis, \xE1tfed\u0151 gyerty\xE1k = kontrakci\xF3; nagy testek, hossz\xFA kan\xF3cok = expanzi\xF3. A kontrakci\xF3t gyakran expanzi\xF3 k\xF6veti \u2014 de az ir\xE1ny ismeretlen.",whyTraders:"Stop- \xE9s c\xE9lm\xE9retez\xE9s, sz\u0171r\xE9s (halott vagy t\xFAlf\u0171t\xF6tt piac), indik\xE1torok normaliz\xE1l\xE1sa.",useful:"Poz\xEDci\xF3m\xE9retn\xE9l: ha az ATR k\xE9tszeres\xE9re n\u0151, ugyanakkora doll\xE1rkock\xE1zathoz kisebb m\xE9ret kell.",misleading:"Az ATR m\xFAltbeli \xE1tlag: egy h\xEDr egyetlen gyerty\xE1val t\xFAll\xE9phet rajta. Az ATR-alap\xFA stop nem veszi figyelembe a strukt\xFAr\xE1t.",bullish:"Kontrakci\xF3 ut\xE1n bullish expanzi\xF3-gyertya a range tetej\xE9n z\xE1r \u2014 de a volatilit\xE1s maga nem bullish.",bearish:"Expanzi\xF3 lefel\xE9, nagy ATR: a stopnak is nagyob
