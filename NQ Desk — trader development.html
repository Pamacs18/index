E9rt\xE9k mindk\xE9t oldalra. BUY = \u03A3(s\xFAly \xD7 bullish) / \u03A3(akt\xEDv s\xFAly). A kikapcsolt komponens a sz\xE1ml\xE1l\xF3b\xF3l \xE9s a nevez\u0151b\u0151l is kiesik. Raw BUY: BUY \u2265 75 \xC9S BUY \u2265 SELL + 10. T\xE9nyleges chart jel: raw + lez\xE1rt gyertya + nem LOW volatilit\xE1s + NY session + \u2265 5 bar az el\u0151z\u0151 jel \xF3ta + nem ism\xE9tl\u0151d\u0151 ir\xE1ny (+ opcion\xE1lisan csak trendv\xE1lt\xE1skor).",recognize:"A Signal Breakdown panel komponensenk\xE9nt mutatja a pontokat (pl. EMA 20/20, RSI 7/10) \xE9s egy \u2713/\u2715 jelet: ir\xE1ny\xEDtott komponensn\xE9l \u2713 ha a domin\xE1ns oldallal egyet\xE9rt (\u2265 60 BUY-n\xE1l, \u2264 40 SELL-n\xE9l), nem ir\xE1ny\xEDtottn\xE1l \u2713 ha \u2265 60.",whyTraders:"\xC1tl\xE1that\xF3, ellen\u0151rizhet\u0151 \xF6sszegz\xE9s. Megmutatja, MI\xC9RT magas vagy alacsony a score.",useful:"Kontextus-ellen\u0151rz\u0151listak\xE9nt: a score seg\xEDt felismerni, ha a technikai k\xE9p rendezett.",misleading:"A score NEM nyer\xE9si val\xF3sz\xEDn\u0171s\xE9g. 80% azt jelenti, hogy a s\xFAlyozott komponensek 80%-ban bullish \xE1llapotban vannak \u2014 nem azt, hogy a k\xF6vetkez\u0151 trade 80% es\xE9llyel nyer. T\xF6bb komponens korrel\xE1l (EMA, ribbon, lila vonal, MACD mind mozg\xF3\xE1tlag-alap\xFA), ez\xE9rt a konfluencia kisebb, mint amilyennek l\xE1tszik.",bullish:"BUY 82, SELL 58: edge 24 \u2265 10, k\xFCsz\xF6b teljes\xFCl, NY session, NORMAL volatilit\xE1s \u2192 BUY (STRONG, mert \u2265 80).",bearish:"SELL 77, BUY 70: edge csak 7 \u2192 WAIT, pedig a SELL a k\xFCsz\xF6b felett van.",reaction:["Olvasd el a Breakdownt, ne csak a sz\xE1zal\xE9kot.","WAIT eset\xE9n n\xE9zd meg, melyik sz\u0171r\u0151 blokkol.","A Radar jelet eg\xE9sz\xEDtsd ki z\xF3n\xE1val, strukt\xFAr\xE1val, kock\xE1zattal.","Ne n\xF6veld a m\xE9retet a magas sz\xE1zal\xE9k miatt."],mistakes:["A score-t val\xF3sz\xEDn\u0171s\xE9gnek hinni.","Azt hinni, hogy az FVG LONG vagy a TL CONF emeli a BUY score-t.","A dashboard Signal sor\xE1t a chart c\xEDmk\xE9vel azonosnak venni.","S\xFAlyokat optimaliz\xE1lni kis mint\xE1n."]},godmode:{title:"Signal engine \u2014 k\xF3d szerint",points:["S\xFAlyok: EMA 20, Ribbon+TL 20, RSI 10, MACD 10, Structure 10, Volatility 10, Volume 5, Price Action 15, NY OR 10 (boost 15).","Oszt\xE1lyoz\xE1s a domin\xE1ns score-ra: \u2265 90 VERY STRONG, \u2265 80 STRONG, \u2265 70 MODERATE, \u2265 60 WEAK, egy\xE9bk\xE9nt NONE.","signalTxt (dashboard) = a raw felt\xE9tel; buySignal (chart c\xEDmke, alert, trade levels) = raw + minden sz\u0171r\u0151.","STRONG BUY c\xEDmke: buySignal \xE9s BUY \u2265 80.","Az OB, FVG, automatikus trendvonal \xE9s VWAP esem\xE9nyek NEM r\xE9szei a score-nak \u2014 k\xFCl\xF6n kontextus \xE9s k\xFCl\xF6n alertek.","Alert: 4 k\xFCl\xF6n alertcondition (BUY, STRONG BUY, SELL, STRONG SELL) + egy egyes\xEDtett alert() minden m\xE1s esem\xE9nyre (\u201EAny alert() function call\u201D)."]},diagram:"score-calculator",exercise:{prompt:"A Score kalkul\xE1torban kapcsold ki a Volatility komponenst egy 78/60-as helyzetben.",steps:["Hogyan v\xE1ltozik a BUY \xE9s a SELL?","\xC1tl\xE9pi-e a k\xFCsz\xF6b\xF6t?"],answer:"Ha a volQuality magasabb volt az \xE1tlagn\xE1l, kikapcsol\xE1sa mindk\xE9t oldalt cs\xF6kkenti; a k\xFCl\xF6nbs\xE9g ar\xE1nyosan n\u0151, mert a nevez\u0151 kisebb lett. A pontos hat\xE1s a kalkul\xE1torban l\xE1that\xF3."},quiz:[{id:"l17q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"BUY 80, SELL 72. Mi a signalTxt?",options:["BUY","STRONG BUY","WAIT","SELL"],correct:2,explanation:"Edge 8 < 10 \u2192 WAIT."},{id:"l17q2",difficulty:"BEGINNER",type:"true_false",prompt:"A 80%-os score 80% nyer\xE9si es\xE9lyt jelent.",options:["Igaz","Hamis"],correct:1,explanation:"Hamis. Technikai konfluencia, nem kalibr\xE1lt val\xF3sz\xEDn\u0171s\xE9g."},{id:"l17q3",difficulty:"ADVANCED",type:"multiple_choice",prompt:"Melyik r\xE9sze a BUY score-nak?",options:["FVG LONG","TL CONF UP","VWAP","Price Action"],correct:3,explanation:"A Price Action komponens (15) r\xE9sze; a t\xF6bbi k\xFCl\xF6n kontextus."},{id:"l17q4",difficulty:"EXPERT",type:"multiple_choice",prompt:"Mi t\xF6rt\xE9nik a nevez\u0151vel, ha a volume adat hi\xE1nyzik?",options:["V\xE1ltozatlan","A volume s\xFAlya kiesik bel\u0151le","Null\xE1ra \xE1ll","Dupl\xE1z\xF3dik"],correct:1,explanation:"useVol and volDataOk \u2014 \xE9rv\xE9nytelen adat eset\xE9n a komponens kiesik a sz\xE1ml\xE1l\xF3b\xF3l \xE9s a nevez\u0151b\u0151l."}],requires:["opening-range"]},{slug:"trade-levels",level:18,tier:"PROFESSIONAL",title:"Trade szintek: ENTRY, SL, TP1\u2013TP3",titleEn:"Trade levels",summary:"Kock\xE1zati \xE9s c\xE9lhozam-t\xE1vols\xE1g, R:R, poz\xEDci\xF3m\xE9ret \u2014 \xE9s a GODMODE ATR szorz\xF3i, amelyek nem igazodnak a strukt\xFAr\xE1hoz.",terms:["Entry","Stop loss","Take profit","Risk distance","Reward distance","Risk/reward ratio","Position sizing","R multiple"],sections:{what:"Az ENTRY a bel\xE9p\xE9si \xE1r, a STOP LOSS (SL) az a szint, ahol a trade-\xF6tlet \xE9rv\xE9nytelen \xE9s kil\xE9psz, a TAKE PROFIT (TP) a c\xE9l\xE1r. Risk distance = |entry \u2212 stop|; reward distance = |target \u2212 entry|; R:R = reward / risk. Az eredm\xE9nyt R-ben (a v\xE1llalt kock\xE1zat t\xF6bbsz\xF6r\xF6s\xE9ben) \xE9rdemes m\xE9rni.",why:"A stop \xE9s a m\xE9ret hat\xE1rozza meg, mennyit vesz\xEDthetsz \u2014 ez az egyetlen dolog, amit egy trade-ben val\xF3ban ir\xE1ny\xEDtasz.",how:"Poz\xEDci\xF3m\xE9ret = floor(kock\xE1zati keret / (stop pont \xD7 pont\xE9rt\xE9k + k\xF6lts\xE9gek)). Ha ez 0, a trade nem f\xE9r bele a keretbe.",recognize:"A j\xF3 stop egy strukt\xFArapont m\xF6g\xF6tt van (z\xF3na, swing), nem egy kerek sz\xE1m m\xF6g\xF6tt tetsz\u0151legesen.",whyTraders:"A tart\xF3s t\xFAl\xE9l\xE9shez: kis, kontroll\xE1lt vesztes\xE9gek \xE9s \xE9sszer\u0171 R:R.",useful:"Minden trade el\u0151tt \u2014 a bel\xE9p\xE9s el\u0151tt kell tudnod a v\xE1laszt.",misleading:"A magas R:R alacsony tal\xE1lati ar\xE1nnyal j\xE1r; a c\xE9l nem garant\xE1lt \xE1r. Az ATR szorz\xF3s szint matematikailag tiszta, de a piacnak nincs k\xF6ze hozz\xE1.",bullish:"BUY jel close 100.9, ATR 1.0: SL 99.4, TP1 102.4, TP2 103.9, TP3 105.9.",bearish:"SELL jel 100.9: SL 102.4, TP1 99.4, TP2 97.9, TP3 95.9.",reaction:["Hol \xE9rv\xE9nytelen az \xF6tlet? Oda a stop (+ puffer).","Ellen\u0151rizd, hogy az ATR stop logikus-e a strukt\xFAr\xE1hoz k\xE9pest.","Sz\xE1mold ki a m\xE9retet a kalkul\xE1torral.","Van-e ellenkez\u0151 z\xF3na/szint a c\xE9l el\u0151tt?","\xCDrd le a tervet a bel\xE9p\xE9s el\u0151tt."],mistakes:["A stopot t\xE1vol\xEDtani vesztes poz\xEDci\xF3ban.","A m\xE9retet a score-hoz igaz\xEDtani.","Az indik\xE1tor TP-it garant\xE1lt c\xE9lnak tekinteni.","Az R:R-b\u0151l kihagyni a jutal\xE9kot \xE9s a cs\xFAsz\xE1st."]},godmode:{title:"Trade levels a k\xF3dban",points:["Csak a f\u0151 Radar buySignal/sellSignal rajzol \xFAj szintk\xE9szletet (FVG LONG vagy TL CONF nem).","Entry = a jelz\u0151 gyertya close-a. SL = entry \u2213 1.5 ATR; TP1 = \xB1 1.5 ATR; TP2 = \xB1 3.0 ATR; TP3 = \xB1 5.0 ATR.","Egyszerre egy akt\xEDv k\xE9szlet: \xFAj jel t\xF6rli a r\xE9git. A vonalak 25 bar hosszan ny\xFAlnak.","A szintek nem igazodnak OB-hoz, FVG-hez, rejection gyerty\xE1hoz vagy trendvonalhoz.","Nincs benne kontraktusm\xE9ret vagy doll\xE1rkock\xE1zat."]},diagram:"trade-levels",exercise:{prompt:"A Trade Levels dem\xF3ban dupl\xE1zd meg az ATR-t.",steps:["Hogyan v\xE1ltozik a stop t\xE1vols\xE1ga?","Mit jelent ez a kontraktussz\xE1mra azonos doll\xE1rkock\xE1zat mellett?"],answer:"A stop t\xE1vols\xE1ga is dupl\xE1z\xF3dik, ez\xE9rt azonos kock\xE1zati keretn\xE9l feleannyi (lefel\xE9 kerek\xEDtve) kontraktus f\xE9r bele."},quiz:[{id:"l18q1",difficulty:"INTERMEDIATE",type:"multiple_choice",prompt:"Entry 200, ATR 4, long. Hol a TP2?",options:["206","212","220","208"],correct:1,explanation:"200 + 3 \xD7 4 = 212."},{id:"l18q2",difficulty:"INTERMEDIATE",type:"true_false",prompt:"Az FVG LONG automatikusan ENTRY/SL/TP s const scrim = $("#scrim"), drawer = $("#drawer"), modal = $("#modal");

  ${lines && lines.length ? `<div class="panel pad mono" style="font-size:12.5px;margin-bottom:12px">${lines.map(esc).join("<br>")}</div>` : ""}

}

// ── engine runs (cached) ──
const runCache = new Map();
function run(id, cfg) {
  const k = id + JSON.stringify(cfg || {});
  if (runCache.has(k)) return runCache.get(k);
  const sp = C.SCENARIOS.find((s) => s.id === id);
  const bars = C.generateBars({ seed: sp.seed, startUtc: C.SCENARIO_START_UTC, startPrice: sp.startPrice, segments: sp.segments });
  const r = C.runGodmode(bars, C.withConfig(cfg || {}));
  r.spec = sp;
  runCache.set(k, r);
  return r;
}

      $("#mgo").onclick = () => { modal.dataset.locked = ""; closeAll(); render(); if (at < r.bars.length - 1) { playing = true; loop(); } }; };

  render();

  const nextL = LESSONS.find((l) => (P.assess[l.slug] || 0) < 80);
  el.innerHTML = `<div class="pagehead"><div><h1>Desk</h1><p class="sub">${esc(P.trader)} · ${t.name} · ${P.attempt}. kísérlet · ${P.playbook.risk.instrument}, ${P.playbook.risk.pct}% kockázat / trade</p></div><div class="ctrl" style="margin:0"><a class="btn pri" href="#session-gen">Új replay session</a><a class="btn" href="#playbook">Playbook</a></div></div>
  ${a.status !== "active" ? `<div class="note ${a.status === "passed" ? "bull" : "bear"}" style="margin-bottom:14px"><b>${a.status === "passed" ? `${t.name} teljesítve.` : "A számla szabályt sértett."}</b> ${a.status === "passed" ? (P.tier < TIERS_ACC.length - 1 ? "Továbbléphetsz a következő számlaszintre." : "Elérted a legmagasabb szintet.") : "Új kísérlet indítható ugyanazon a szinten — nézd át a journalt előtte."} <button class="btn sm" id="nextAcc" style="margin-left:8px">${a.status === "passed" && P.tier < TIERS_ACC.length - 1 ? `Tovább: ${TIERS_ACC[P.tier + 1].name}` : "Új kísérlet"}</button></div>` : ""}
  <div class="grid3">
    <section class="box"><h2>Számla</h2><dl class="kvs">${stat("Egyenleg", usd(a.balance))}${stat("Nettó P&L", usd(a.balance - a.start, true), a.balance >= a.start ? "up" : "dn")}${stat("Csúcs egyenleg", usd0(a.peak))}${stat("Drawdown limit", usd0(a.peak - t.maxDd))}</dl>
      ${meter("Profit target", Math.max(0, a.balance - a.start), t.target)}${meter("Drawdown puffer", Math.max(0, ddLeft()), t.maxDd, true)}<div class="meter"><div class="mrowt"><span>Session</span><span class="num">${a.sessions} / ${t.minSessions}</span></div><div class="bar"><i style="width:${Math.min(100, (a.sessions / t.minSessions) * 100)}%"></i></div></div></section>
    <section class="box span2"><h2>Equity — aktuális kísérlet</h2>${equitySvg(eqPoints())}<dl class="kvs row">${stat("Trade", cur.n)}${stat("Win rate", (cur.wr * 100).toFixed(0) + "%")}${stat("Profit factor", cur.pf === Infinity ? "∞" : cur.pf.toFixed(2))}${stat("Átlag R", cur.avgR.toFixed(2), cur.avgR >= 0 ? "up" : "dn")}${stat("Playbookon belül", (cur.inPb * 100).toFixed(0) + "%")}</dl></section>
  </div>
  <div class="grid3" style="margin-top:12px">
    <section class="box"><h2>Curriculum</h2>${MODS.map((m) => { const d = m[2].filter((n) => (P.assess[LV.get(n).slug] || 0) >= 80).length; return `<a class="lrow" href="#curriculum"><span class="num dim">${m[0]}</span><span>${m[1]}</span><span class="num ${modCert(m) ? "up" : "dim"}">${d}/${m[2].length}</span></a>`; }).join("")}${nextL ? `<a class="btn sm" style="margin-top:10px" href="#lesson-${nextL.slug}">Következő: ${nextL.level}. ${esc(nextL.title)}</a>` : ""}</section>
    <section class="box span2"><h2>Utolsó trade-ek</h2>${tradeTable(P.trades.slice(-8).reverse())}</section>
  </div>
  <section class="box" style="margin-top:12px"><h2>Számlatörténet</h2>${P.history.length ? `<table><thead><tr><th>Szint</th><th>Kísérlet</th><th>Egyenleg</th><th>Állapot</th><th>Idő</th></tr></thead><tbody>${P.history.slice(-10).reverse().map((h) => `<tr><td>${h.tier}</td><td class="num">${h.attempt}</td><td class="num">${usd0(h.balance)}</td><td>${h.status === "active" ? "aktív" : h.status === "passed" ? '<span class="up">teljesítve</span>' : '<span class="dn">megsértve</span>'}</td><td class="num dim">${new Date(h.at).toLocaleString("hu-HU", { dateStyle: "short", timeStyle: "short" })}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Az első lezárt session után jelenik meg.</div>`}</section>`;
  const nb = document.getElementById("nextAcc"); if (nb) nb.onclick = () => { if (a.status === "passed" && P.tier < TIERS_ACC.length - 1) { P.tier++; P.attempt = 1; } else P.attempt++; newAccount(); psave(); proute(); };
};
function tradeTable(ts) {
  if (!ts.length) return `<div class="empty">Még nincs trade.</div>`;
  return `<div class="tw"><table><thead><tr><th>Session</th><th>Irány</th><th>Qty</th><th>Entry</th><th>Exit</th><th>R</th><th>P&L</th><th>Setup</th><th>Kilépés</th></tr></thead><tbody>${ts.map((t) => `<tr><td class="dim">${esc(t.session)}</td><td class="${t.dir === 1 ? "up" : "dn"}">${t.dir === 1 ? "Long" : "Short"}</td><td class="num">${t.qty} ${t.instrument}</td><td class="num">${t.entry.toFixed(2)}</td><td class="num">${t.exit.toFixed(2)}</td><td class="num ${t.r >= 0 ? "up" : "dn"}">${t.r.toFixed(2)}</td><td class="num ${t.pnl >= 0 ? "up" : "dn"}">${usd(t.pnl, true)}</td><td>${t.inPlaybook ? esc(t.setup) : '<span class="dn">Playbookon kívül</span>'}</td><td class="dim">${esc(t.why)}</td></tr>`).join("")}</tbody></table></div>`;
}

V.sessions = (el) => {
  const best = (id) => P.sessions.filter((s) => s.id === id).reduce((m, s) => (m === null || s.pnl > m ? s.pnl : m), null);
  el.innerHTML = `<div class="pagehead"><div><h1>Replay sessions</h1><p class="sub">Coached session: kurált forgatókönyv oktatói értékeléssel minden döntési pontnál. Generált session: új, determinisztikus piac, csak az eredmény számít.</p></div><a class="btn pri" href="#session-gen">Generált session indítása</a></div>
  <section class="box"><table><thead><tr><th>Coached session</th><th>Fókusz</th><th>Lefutott</th><th>Legjobb P&L</th><th></th></tr></thead><tbody>${C.SCENARIOS.map((s) => { const b = best(s.id); return `<tr><td><b>${esc(s.title)}</b></td><td class="dim">${esc(s.focus.join(", "))}</td><td class="num">${P.sessions.filter((x) => x.id === s.id).length}</td><td class="num ${b > 0 ? "up" : b < 0 ? "dn" : "dim"}">${b === null ? "—" : usd(b, true)}</td><td style="text-align:right"><a class="btn sm" href="#session-${s.id}">Indítás</a></td></tr>`; }).join("")}</tbody></table></section>
  <p class="dim" style="font-size:12.5px;margin-top:10px">Minden adat szintetikus és determinisztikus — nem valós NQ ár, és a szimulált eredmény nem jelzi a valós teljesítményt.</p>`;
};

V.session = (el, id) => {
  if (P.acct.status !== "active") { el.innerHTML = `<div class="note bear"><b>A számla nem aktív.</b> Indíts új kísérletet vagy lépj szintet a Desken.</div><p><a class="btn" href="#desk">Desk</a></p>`; return; }
  const gen = id === "gen" || id.startsWith("gen-"), seed = id === "gen" ? Math.floor(Math.random() * 1e6) : gen ? +id.slice(4) : 0;
  if (id === "gen") { location.replace(`#session-gen-${seed}`); return; }
  const r = gen ? genSession(seed) : run(id), spec = r.spec;
  const cps = gen ? decisionBars(r, spec.warmup) : C.resolveCheckpoints(spec, r).resolved.map((c) => ({ bar: c.bar, event: c.event, cp: c }));
  const rk = P.playbook.risk, start = P.acct.balance;
  let at = spec.warmup, playing = false, speed = 350, timer = null, open = null, done = new Set(), sTrades = [], log = [], proc = [], ended = false;
  el.innerHTML = `<div class="pagehead"><div><h1>${esc(spec.title)}</h1><p class="sub">${gen ? "Generált session" : "Coached session"} · ${rk.instrument} · ${rk.pct}% kockázat · SL ${rk.stopAtr} ATR · TP ${rk.targetR}R · max ${rk.maxTrades} trade</p></div><a class="btn sm" href="#sessions">Kilépés</a></div>
  <div class="sessgrid"><div><div id="sc"></div><div class="ctrl"><button class="btn sm" id="sp" aria-label="Előző">◀</button><button class="btn sm pri" id="sply">Lejátszás</button><button class="btn sm" id="sn" aria-label="Következő">▶</button><div class="seg" id="sspd"><button data-v="700">1×</button><button class="on" data-v="350">2×</button><button data-v="175">4×</button></div><button class="btn sm" id="sopt">Megjelenítés</button><span class="num dim" id="sinfo" style="margin-left:auto;font-size:12px"></span></div></div>
  <aside><div class="box" id="ticket"></div><div class="box" style="margin-top:10px"><h2>Session</h2><dl class="kvs" id="sstat"></dl></div><div class="box" style="margin-top:10px"><h2>Log</h2><div id="slog" class="log"></div></div></aside></div>`;
  const ch = new Chart(document.getElementById("sc"), r, { height: 520, window: 120, layers: { levels: 0, mode: "compact" } }); ch.userTrades = [];
  const L = (html) => { log.unshift(html); document.getElementById("slog").innerHTML = log.join(""); };
  const sessPnl = () => sTrades.reduce((s, t) => s + t.pnl, 0);
  const ctx = (i) => { const s = r.states[i], b = r.bars[i]; return `<dl class="kvs mini">${stat("Ár", b.close.toFixed(2))}${stat("ATR", s.atr.toFixed(2))}${stat("BUY / SELL", `${s.buyScore.toFixed(0)} / ${s.sellScore.toFixed(0)}`)}${stat("Radar", s.signalTxt)}${stat("Ribbon", s.trendState === 1 ? "BULL" : s.trendState === -1 ? "BEAR" : "NEUT")}${stat("VWAP", b.close > s.vwap ? "felett" : "alatt")}${stat("Volatilitás", s.volatilityState)}${stat("Structure", s.msState)}</dl>`; };
  const ticketIdle = () => { document.getElementById("ticket").innerHTML = `<h2>Order ticket</h2><p class="dim" style="margin:0;font-size:13px">${open ? `Nyitott pozíció: ${open.dir === 1 ? "Long" : "Short"} ${open.qty} ${open.instrument} @ ${open.entry.toFixed(2)} · SL ${open.sl.toFixed(2)} · TP ${open.tp.toFixed(2)}` : ended ? "A session lezárult." : "A replay a következő döntési pontnál megáll."}</p>`; };
  const renderStat = () => { const p = sessPnl(); document.getElementById("sstat").innerHTML = stat("Session P&L", usd(p, true), p > 0 ? "up" : p < 0 ? "dn" : "") + stat("Trade", `${sTrades.length} / ${rk.maxTrades}`) + stat("Napi limit hátra", usd0(tier().daily + Math.min(0, p))) + stat("Egyenleg", usd(P.acct.balance)); };
  const ask = (k) => { const d = cps[k], i = d.bar, L1 = sizeTrade(1, r, i), S1 = sizeTrade(-1, r, i);
    const pb = (dir) => P.playbook.setups.filter((s) => s.dir === 0 || s.dir === dir).map((s) => { const m = setupMatch(s, r, i), ok = m.every(([, v]) => v);
      return `<div class="setup ${ok ? "ok" : ""}"><div class="sh"><b>${esc(s.name)}</b><span class="${ok ? "up" : "dim"}">${ok ? "Feltételek teljesülnek" : `${m.filter(([, v]) => v).length}/${m.length}`}</span></div>${m.map(([rk2, v]) => `<div class="rl ${v ? "up" : "dim"}">${v ? "✓" : "✕"} ${esc(RULES[rk2][0])}</div>`).join("")}</div>`; }).join("") || `<div class="dim">Nincs ilyen irányú setup a playbookban.</div>`;
    const leg = (t, dir) => t.qty < 1 ? `<button class="btn" disabled>${dir === 1 ? "Long" : "Short"} — POSITION TOO LARGE</button>` : `<button class="btn ${dir === 1 ? "bull" : "bear"}" data-dir="${dir}">${dir === 1 ? "Buy" : "Sell"} ${t.qty} ${t.instrument}</button>`;
    document.getElementById("ticket").innerHTML = `<h2>Order ticket <span class="badge b-cyan">${esc(d.event)}</span></h2>${!gen && d.cp ? `<p style="margin:0 0 10px;font-size:13.5px">${esc(d.cp.question)}</p>` : ""}${ctx(i)}
      <div class="legs"><div><div class="lt">Long</div><div class="num dim">SL ${L1.sl.toFixed(2)} · TP ${L1.tp.toFixed(2)} · kockázat ${usd0(L1.qty * L1.perC)}</div></div><div><div class="lt">Short</div><div class="num dim">SL ${S1.sl.toFixed(2)} · TP ${S1.tp.toFixed(2)} · kockázat ${usd0(S1.qty * S1.perC)}</div></div></div>
      <div class="ctrl">${leg(L1, 1)}${leg(S1, -1)}<button class="btn" data-dir="0">Pass</button></div>
      <details class="pbm" open><summary>Playbook ellenőrzés</summary><div class="two" style="gap:10px;margin-top:8px"><div><div class="lt">Long setupok</div>${pb(1)}</div><div><div class="lt">Short setupok</div>${pb(-1)}</div></div></details>`;
    document.getElementById("ticket").onclick = (e) => { const b = e.target.closest("[data-dir]"); if (!b || b.disabled) return; decide(k, +b.dataset.dir); };
    document.getElementById("ticket").scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  const decide = (k, dir) => { const d = cps[k], i = d.bar; done.add(k);
    if (!gen && d.cp) { const choice = dir === 1 ? "BUY" : dir === -1 ? "SELL" : (d.cp.verdicts["WAIT"] === "best" || !d.cp.verdicts["NO TRADE"] ? "WAIT" : "NO TRADE"), v = d.cp.verdicts[choice] || "poor"; proc.push(v);
      L(`<div class="le"><span class="num dim">${fmtNy.format(new Date(r.bars[i].time * 1000))}</span> Oktatói értékelés (${choice}): <b class="${v === "best" ? "up" : v === "poor" ? "dn" : "neu"}">${{ best: "legjobb döntés", acceptable: "védhető", poor: "gyenge" }[v]}</b><div class="dim">${esc(d.cp.explanation)}</div></div>`); }
    if (dir) { const t = sizeTrade(dir, r, i), res = resolveTrade(t, r, i), inPb = P.playbook.setups.find((s) => setupOk(s, r, i, dir));
      open = Object.assign(t, res, { bar: i, setup: inPb ? inPb.name : null, inPlaybook: Boolean(inPb), session: spec.title });
      ch.userTrades.push(open);
      L(`<div class="le"><span class="num dim">${fmtNy.format(new Date(r.bars[i].time * 1000))}</span> <b class="${dir === 1 ? "up" : "dn"}">${dir === 1 ? "BUY" : "SELL"} ${t.qty} ${t.instrument} @ ${t.entry.toFixed(2)}</b> · SL ${t.sl.toFixed(2)} · TP ${t.tp.toFixed(2)}${inPb ? ` · ${esc(inPb.name)}` : ` · <span class="dn">playbookon kívül</span>`}</div>`); }
    else L(`<div class="le"><span class="num dim">${fmtNy.format(new Date(r.bars[i].time * 1000))}</span> Pass — nincs belépés.</div>`);
    ticketIdle(); renderStat(); playing = true; loop();
  };
  const settle = () => { if (!open || at < open.exitBar) return; const t = open; t.pnl = tradePnl(t); t.r = t.pnl / (t.qty * t.perC); t.attempt = P.attempt; t.tier = P.tier; t.at = Date.now();
    P.acct.balance += t.pnl; P.acct.peak = Math.max(P.acct.peak, P.acct.balance); P.trades.push(t); sTrades.push(t); open = null; psave();
    L(`<div class="le"><span class="num dim">${fmtNy.format(new Date(r.bars[t.exitBar].time * 1000))}</span> Zárás @ ${t.exit.toFixed(2)} (${esc(t.why)}): <b class="num ${t.pnl >= 0 ? "up" : "dn"}">${usd(t.pnl, true)} · ${t.r.toFixed(2)}R</b></div>`); renderStat(); ticketIdle();
    if (sessPnl() <= -tier().daily || P.acct.balance <= P.acct.peak - tier().maxDd) finishSession("Kockázati limit elérve — a session leállt."); };
  const finishSession = (why) => { if (ended) return; ended = true; stop();
    if (open) { open.exitBar = at; open.exit = r.bars[at].close; open.why = "Session zárás"; const t = open; open = null; t.pnl = tradePnl(t); t.r = t.pnl / (t.qty * t.perC); t.attempt = P.attempt; t.tier = P.tier; t.at = Date.now(); P.acct.balance += t.pnl; P.acct.peak = Math.max(P.acct.peak, P.acct.balance); P.trades.push(t); sTrades.push(t); }
    const s = { id: spec.id, title: spec.title, pnl: sessPnl(), trades: sTrades.length, process: proc.length ? proc.filter((v) => v !== "poor").length / proc.length : null, at: Date.now() };
    const msg = closeSession(s), stt = stats(sTrades);
    openModal(`<h2 style="margin-top:0">Session összesítő</h2>${why ? `<p class="dim">${why}</p>` : ""}<dl class="kvs row">${stat("Session P&L", usd(s.pnl, true), s.pnl >= 0 ? "up" : "dn")}${stat("Trade", stt.n)}${stat("Win rate", (stt.wr * 100).toFixed(0) + "%")}${stat("Átlag R", stt.avgR.toFixed(2))}${stat("Playbookon belül", (stt.inPb * 100).toFixed(0) + "%")}${s.process !== null ? stat("Döntésminőség", (s.process * 100).toFixed(0) + "%") : ""}</dl>
      <dl class="kvs row" style="margin-top:12px">${stat("Egyenleg", usd(P.acct.balance))}${stat("Target hátra", usd0(Math.max(0, toTarget())))}${stat("DD puffer", usd0(Math.max(0, ddLeft())))}${stat("Session", `${P.acct.sessions} / ${tier().minSessions}`)}</dl>
      ${msg ? `<div class="note ${P.acct.status === "passed" ? "bull" : "bear"}" style="margin-top:14px"><b>${P.acct.status === "passed" ? "Evaluation teljesítve." : "Szabálysértés."}</b> ${msg}</div>` : ""}
      <div class="ctrl" style="justify-content:flex-end"><a class="btn" href="#journal" data-close>Journal</a><a class="btn" href="#desk" data-close>Desk</a>${P.acct.status === "active" ? `<a class="btn pri" href="#session-gen" data-close>Következő session</a>` : ""}</div>`);
  };
  const render = () => { ch.highlight = null; ch.set(at); document.getElementById("sinfo").textContent = `${at - spec.warmup + 1} / ${r.bars.length - spec.warmup} · ${fmtNy.format(new Date(r.bars[at].time * 1000))} NY`; document.getElementById("sply").textContent = playing ? "Szünet" : "Lejátszás";
    settle(); if (ended) return;
    const k = cps.findIndex((d, j) => !done.has(j) && d.bar <= at);
    if (k >= 0) { if (open || sTrades.length + (open ? 1 : 0) >= rk.maxTrades) { done.add(k); if (!open) L(`<div class="le dim">Max trade/session elérve — ${esc(cps[k].event)} kihagyva.</div>`); } else { stop(); ch.highlight = cps[k].bar; ch.draw(); ask(k); } }
    if (at >= r.bars.length - 1) finishSession(); };
  const stop = () => { playing = false; clearTimeout(timer); const b = document.getElementById("sply"); if (b) b.textContent = "Lejátszás"; };
  const loop = () => { if (!playing || ended) return; if (at >= r.bars.length - 1) return render(); at++; render(); timer = setTimeout(loop, speed); };
  document.getElementById("sply").onclick = () => { if (playing) stop(); else if (!document.querySelector("#ticket [data-dir]")) { playing = true; loop(); } };
  document.getElementById("sn").onclick = () => { if (document.querySelector("#ticket [data-dir]")) return; stop(); if (at < r.bars.length - 1) at++; render(); };
  document.getElementById("sp").onclick = () => { stop(); at = Math.max(spec.warmup, at - 1); ch.set(at); };
  document.getElementById("sspd").onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; speed = +b.dataset.v; document.querySelectorAll("#sspd button").forEach((x) => x.classList.toggle("on", x === b)); };
  document.getElementById("sopt").onclick = () => { openDrawer(`<h2 id="drawerTitle" style="margin-top:0">Megjelenítés</h2><div id="lp">${layerPanel(ch)}</div>`); bindLayers(document.getElementById("lp"), ch); };
  const key = (e) => { if (modal.classList.contains("open") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === " ") { e.preventDefault(); document.getElementById("sply").click(); } else if (e.key === "ArrowRight") document.getElementById("sn").click(); };
  addEventListener("keydown", key); onLeave(() => { stop(); removeEventListener("keydown", key); if (!ended && (sTrades.length || open)) finishSession("A session megszakítva."); });
  ticketIdle(); renderStat(); render();
};

  const pb = P.playbook, st = (name) => stats(P.trades.filter((t) => (name ? t.setup === name : !t.inPlaybook)));
  const draw = () => { el.innerHTML = `<div class="pagehead"><div><h1>Playbook</h1><p class="sub">A saját szabályrendszered. A replay ticket minden döntésnél ezek alapján jelzi, hogy egy trade playbookon belül vagy kívül van. A szabályok a GODMODE motor valós állapotából számolódnak.</p></div><button class="btn pri" id="addS">Új setup</button></div>
    <section class="box"><h2>Kockázati paraméterek</h2><div class="formgrid">
      <div><label class="f" for="pi">Instrumentum</label><select id="pi" data-r="instrument"><option ${pb.risk.instrument === "MNQ" ? "selected" : ""}>MNQ</option><option ${pb.risk.instrument === "NQ" ? "selected" : ""}>NQ</option></select></div>
      <div><label class="f" for="pp">Kockázat / trade (%)</label><input type="number" id="pp" data-r="pct" step="0.05" min="0.05" max="2" value="${pb.risk.pct}"></div>
      <div><label class="f" for="ps">Stop (ATR ×)</label><input type="number" id="ps" data-r="stopAtr" step="0.25" min="0.5" max="4" value="${pb.risk.stopAtr}"></div>
      <div><label class="f" for="pt">Target (R)</label><input type="number" id="pt" data-r="targetR" step="0.25" min="0.5" max="6" value="${pb.risk.targetR}"></div>
      <div><label class="f" for="pm">Max trade / session</label><input type="number" id="pm" data-r="maxTrades" step="1" min="1" max="6" value="${pb.risk.maxTrades}"></div></div>
      <p class="dim" style="font-size:12.5px;margin:10px 0 0">Költségek a szimulációban: jutalék (NQ $4.20, MNQ $1.50 / kontraktus) + 2 tick csúszás. Stop és target egyszerre ugyanazon a baron: stop (konzervatív).</p></section>
    ${pb.setups.map((s, k) => { const x = st(s.name); return `<section class="box" style="margin-top:12px"><div class="sh"><input type="text" value="${esc(s.name)}" data-sn="${k}" aria-label="Setup neve" style="max-width:340px;font-weight:600"><span class="ctrl" style="margin:0"><select data-sd="${k}" style="width:auto"><option value="1" ${s.dir === 1 ? "selected" : ""}>Long</option><option value="-1" ${s.dir === -1 ? "selected" : ""}>Short</option><option value="0" ${s.dir === 0 ? "selected" : ""}>Mindkét irány</option></select><button class="btn sm" data-del="${k}">Törlés</button></span></div>
      <dl class="kvs row" style="margin:10px 0">${stat("Trade", x.n)}${stat("Win rate", x.n ? (x.wr * 100).toFixed(0) + "%" : "—")}${stat("Átlag R", x.n ? x.avgR.toFixed(2) : "—")}${stat("Nettó", x.n ? usd(x.net, true) : "—", x.net >= 0 ? "up" : "dn")}</dl>
      <div class="rulegrid">${Object.entries(RULES).map(([rk, [lbl]]) => `<label><input type="checkbox" data-rule="${k}:${rk}" ${s.rules.includes(rk) ? "checked" : ""}> ${esc(lbl)}</label>`).join("")}</div></section>`; }).join("")}
    <section class="box" style="margin-top:12px"><h2>Playbookon kívüli trade-ek</h2>${(() => { const x = st(null); return `<dl class="kvs row">${stat("Trade", x.n)}${stat("Win rate", x.n ? (x.wr * 100).toFixed(0) + "%" : "—")}${stat("Átlag R", x.n ? x.avgR.toFixed(2) : "—")}${stat("Nettó", x.n ? usd(x.net, true) : "—", x.net >= 0 ? "up" : "dn")}</dl>`; })()}<p class="dim" style="font-size:12.5px;margin:8px 0 0">Ha ez a csoport rosszabbul teljesít, mint a setupjaid, a fegyelem többet ér bármelyik indikátornál.</p></section>`; };
  draw();
  el.onchange = (e) => { const t = e.target;
    if (t.dataset.r) { pb.risk[t.dataset.r] = t.dataset.r === "instrument" ? t.value : Math.max(+t.min || 0, Math.min(+t.max || 99, +t.value)); }
    if (t.dataset.sn !== undefined) pb.setups[+t.dataset.sn].name = t.value.trim() || "Névtelen setup";
    if (t.dataset.sd !== undefined) pb.setups[+t.dataset.sd].dir = +t.value;
    if (t.dataset.rule) { const [k, rk] = t.dataset.rule.split(":"), s = pb.setups[+k]; s.rules = t.checked ? [...new Set([...s.rules, rk])] : s.rules.filter((x) => x !== rk); }
    psave(); };
  el.onclick = (e) => { if (e.target.id === "addS") { pb.setups.push({ id: "s" + Date.now(), name: "Új setup", dir: 1, rules: ["nySession", "notLowVol"] }); psave(); draw(); }
    const d = e.target.closest("[data-del]"); if (d && confirm("Törlöd ezt a setupot?")) { pb.setups.splice(+d.dataset.del, 1); psave(); draw(); } };
};

V.curriculum = (el) => {
  el.innerHTML = `<div class="pagehead"><div><h1>Curriculum</h1><p class="sub">20 lecke hét modulban. Minden lecke: tananyag interaktív charttal, majd értékelés (a lecke kérdései + generált számítási és chart-feladatok). Egy modul akkor minősített, ha minden leckéje legalább 80%.</p></div></div>
  ${MODS.map((m) => `<section class="box" style="margin-top:12px"><div class="sh"><h2 style="margin:0">${m[0]} · ${m[1]}</h2>${modCert(m) ? '<span class="badge b-bull">Minősítve</span>' : '<span class="badge">Folyamatban</span>'}</div>
    <table style="margin-top:8px"><thead><tr><th style="width:40px">#</th><th>Lecke</th><th>Tananyag</th><th>Legjobb értékelés</th><th></th></tr></thead><tbody>${m[2].map((n) => { const l = LV.get(n), sc = P.assess[l.slug];
      return `<tr><td class="num dim">${n}</td><td><b>${esc(l.title)}</b><div class="dim" style="font-size:12.5px">${esc(l.titleEn)}</div></td><td>${P.studied[l.slug] ? '<span class="up">✓ elolvasva</span>' : '<span class="dim">—</span>'}</td><td class="num ${sc >= 80 ? "up" : sc !== undefined ? "dn" : "dim"}">${sc !== undefined ? sc + "%" : "—"}</td><td style="text-align:right;white-space:nowrap"><a class="btn sm" href="#lesson-${l.slug}">Anyag</a> <a class="btn sm ${P.studied[l.slug] ? "pri" : ""}" href="#assess-${l.slug}">Értékelés</a></td></tr>`; }).join("")}</tbody></table></section>`).join("")}`;
};

// ── assessment / drill runner ──
function runSet(host, qs, onEnd) {
  let i = 0, ok = 0, answered = false;
  const draw = () => { if (i >= qs.length) return onEnd(ok, qs.length); const q = qs[i]; answered = false;
    const body = q.type === "mc" ? q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="ol num">${"ABCDEF"[k]}</span>${esc(o)}</button>`).join("")
      : q.type === "num" ? `<div class="ctrl"><input type="number" step="any" inputmode="decimal" id="numIn" style="max-width:220px" aria-label="Válasz">${q.unit ? `<span class="dim">${q.unit}</span>` : ""}<button class="btn pri" id="numGo">Ellenőrzés</button></div>`
      : q.type === "pick" ? `<div id="pickHost"></div>` : `<div id="seqShow" class="seqshow"></div><div id="seqOpts">${shuffle(q.items.map((t, k) => [t, k])).map(([t, k]) => `<button class="opt" data-s="${k}">${esc(t)}</button>`).join("")}</div>`;
    host.innerHTML = `<div class="drill"><div class="drillhead"><span class="num dim">${i + 1} / ${qs.length}</span><span class="badge">${esc(q.tag || "Feladat")}</span><span class="num dim">${ok} helyes</span></div><div class="bar" style="margin-bottom:14px"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="box"><p class="qp">${esc(q.prompt)}</p>${q.candle ? candleSvg(q.candle) : ""}${body}<div id="fb"></div></div></div>`;
    if (q.type === "pick") drawPick(document.getElementById("pickHost"), q, (k) => fin(k === q.correct, k));
    const ng = document.getElementById("numGo"); if (ng) { const go = () => { const v = parseFloat(String(document.getElementById("numIn").value).replace(",", ".")); if (isFinite(v)) fin(Math.abs(v - q.answer) <= Math.max(q.tol, 1e-9)); }; ng.onclick = go; document.getElementById("numIn").onkeydown = (e) => e.key === "Enter" && go(); } };
  const fin = (correct, chosen) => { if (answered) return; answered = true; const q = qs[i]; if (correct) ok++;
    const tg = q.tag || "Feladat"; P.drills.n++; if (correct) P.drills.ok++; const bt = (P.drills.byTag[tg] = P.drills.byTag[tg] || { n: 0, ok: 0 }); bt.n++; if (correct) bt.ok++; psave();
    if (q.type === "mc") host.querySelectorAll(".opt").forEach((b) => { b.disabled = true; const k = +b.dataset.k; if (k === q.correct) b.classList.add("ok"); else if (k === chosen) b.classList.add("bad"); });
    if (q.type === "num") { document.getElementById("numIn").disabled = true; document.getElementById("numGo").disabled = true; }
    document.getElementById("fb").innerHTML = `<div class="note ${correct ? "bull" : "bear"}" style="margin-top:12px"><b>${correct ? "Helyes." : "Helytelen."}</b>${q.type === "num" ? ` Helyes érték: <b class="num">${(+q.answer.toFixed(3))}${q.unit ? " " + q.unit : ""}</b>.` : ""} ${esc(q.explanation)}</div><div style="text-align:right;margin-top:12px"><button class="btn pri" id="nextQ">${i + 1 === qs.length ? "Eredmény" : "Következő"}</button></div>`;
    document.getElementById("nextQ").onclick = () => { i++; draw(); }; document.getElementById("nextQ").focus(); };
  host.onclick = (e) => { const q = qs[i]; if (!q || answered) return; const b = e.target.closest("[data-k]"); if (b && q.type === "mc") return fin(+b.dataset.k === q.correct, +b.dataset.k);
    const s = e.target.closest("[data-s]"); if (s && q.type === "order" && !s.disabled) { const seq = (host._seq = host._seq || []); seq.push(+s.dataset.s); s.disabled = true; s.classList.add("ex");
      document.getElementById("seqShow").innerHTML = seq.map((k, n) => `<div class="seqi"><span class="num">${n + 1}</span>${esc(q.items[k])}</div>`).join("");
      if (seq.length === q.items.length) { const right = seq.every((k, n) => k === n); host._seq = []; fin(right); if (!right) document.getElementById("fb").insertAdjacentHTML("afterbegin", `<div class="note" style="margin-top:12px"><b>Helyes sorrend:</b> ${q.items.map((t, n) => `${n + 1}. ${esc(t)}`).join("; ")}</div>`); } } };
  draw();
}
function candleSvg([o, h, l, c]) { const y = (v) => 150 - v * 1.4, col = c >= o ? "var(--bull)" : "var(--bear)"; return `<svg viewBox="0 0 120 150" width="110" height="140" role="img" aria-label="Gyertya" style="display:block;margin:4px 0 12px;background:var(--bg2);border:1px solid var(--line)"><line x1="60" x2="60" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="2"/><rect x="46" y="${y(Math.max(o, c))}" width="28" height="${Math.max(3, Math.abs(y(o) - y(c)))}" fill="${col}"/></svg>`; }
function drawPick(host, q, cb) {
  const bars = q.bars, W = 640, H = 230, lo = Math.min(...bars.map((b) => b.low)), hi = Math.max(...bars.map((b) => b.high)), sp = hi - lo || 1, y = (p) => 14 + (hi - p) / sp * (H - 28), st = W / bars.length, x = (i) => st * i + st / 2, bw = st * 0.55;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--chart-bg);border:1px solid var(--line)" role="group" aria-label="Gyertyák">${q.marker !== null && q.marker !== undefined ? `<line x1="${x(q.marker)}" x2="${x(q.marker)}" y1="0" y2="${H}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="${x(q.marker) + 5}" y="14" font-size="11" fill="var(--accent)">BOS</text>` : ""}${bars.map((b, i) => { const c = b.close >= b.open ? "#26a69a" : "#ef5350"; return `<g data-b="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="${i + 1}. gyertya"><rect x="${x(i) - st / 2}" y="0" width="${st}" height="${H}" fill="transparent"/><line x1="${x(i)}" x2="${x(i)}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${c}" stroke-width="1.3"/><rect class="cb" x="${x(i) - bw / 2}" y="${y(Math.max(b.open, b.close))}" width="${bw}" height="${Math.max(2, Math.abs(y(b.open) - y(b.close)))}" fill="${c}"/></g>`; }).join("")}</svg><p class="dim" style="font-size:12.5px;margin:6px 0 0">Válaszd ki a gyertyát.</p>`;
  const svg = host.querySelector("svg"); let dn = false; const mark = (n, col) => { const r = svg.querySelector(`[data-b="${n}"] .cb`); r.setAttribute("stroke", col); r.setAttribute("stroke-width", "3"); };
  const choose = (g) => { if (dn) return; dn = true; const k = +g.dataset.b; mark(k, k === q.correct ? "var(--bull)" : "var(--bear)"); if (k !== q.correct) mark(q.correct, "var(--bull)"); cb(k); };
  svg.addEventListener("click", (e) => { const g = e.target.closest("[data-b]"); if (g) choose(g); }); svg.addEventListener("keydown", (e) => { const g = e.target.closest("[data-b]"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); choose(g); } });
}
V.assess = (el, slug) => { const l = BY.get(slug); if (!l) return V.curriculum(el);
  const qs = [...l.quiz.map(fromQuiz), ...buildDrillSet(slug, 6).filter((q) => q.tag !== "Kvíz")];
  el.innerHTML = `<div class="pagehead"><div><h1>Értékelés: ${esc(l.title)}</h1><p class="sub">${qs.length} feladat. Minősítési küszöb: 80%. A számítási és chart-feladatok minden alkalommal újragenerálódnak.</p></div><a class="btn sm" href="#curriculum">Curriculum</a></div><div id="ah"></div>`;
  runSet(document.getElementById("ah"), qs, (ok, n) => { const p = Math.round((ok / n) * 100); P.assess[slug] = Math.max(P.assess[slug] || 0, p); psave();
    document.getElementById("ah").innerHTML = `<div class="box drill"><dl class="kvs row">${stat("Eredmény", p + "%", p >= 80 ? "up" : "dn")}${stat("Helyes", `${ok} / ${n}`)}${stat("Legjobb", P.assess[slug] + "%")}</dl><p class="dim" style="margin:12px 0 0">${p >= 80 ? "A lecke minősítve." : "A küszöb 80%. Nézd át az anyagot, majd ismételd meg."}</p><div class="ctrl"><a class="btn pri" href="#curriculum">Curriculum</a><a class="btn" href="#lesson-${slug}">Anyag</a><button class="btn" id="again">Új értékelés</button></div></div>`;
    document.getElementById("again").onclick = () => proute(); }); };

V.drill = (el) => {
  const tags = Object.entries(P.drills.byTag).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n);
  el.innerHTML = `<div class="pagehead"><div><h1>Pre-market drill</h1><p class="sub">10 vegyes, generált feladat az egész anyagból: tick- és kockázatszámítás, FVG/OB felismerés, signal engine, sessionök. Napi bemelegítésnek készült.</p></div></div>
  <div class="sessgrid"><div id="dh"></div><aside><div class="box"><h2>Pontosság témánként</h2>${tags.length ? `<table><tbody>${tags.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="num ${v.ok / v.n >= 0.8 ? "up" : v.ok / v.n < 0.6 ? "dn" : ""}" style="text-align:right">${Math.round((v.ok / v.n) * 100)}% <span class="dim">(${v.n})</span></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Az első kör után jelenik meg.</div>`}<p class="dim" style="font-size:12.5px;margin:10px 0 0">Összesen: <span class="num">${P.drills.ok} / ${P.drills.n}</span></p></div></aside></div>`;
  const all = Object.keys(DRILLS), qs = Array.from({ length: 10 }, () => pick(DRILLS[pick(all)])());
  runSet(document.getElementById("dh"), qs, (ok, n) => { document.getElementById("dh").innerHTML = `<div class="box"><dl class="kvs row">${stat("Eredmény", Math.round((ok / n) * 100) + "%")}${stat("Helyes", `${ok} / ${n}`)}</dl><div class="ctrl"><button class="btn pri" id="again">Új kör</button><a class="btn" href="#desk">Desk</a></div></div>`; document.getElementById("again").onclick = () => proute(); });
};

V.journal = (el) => {
  let f = "all"; const draw = () => { const ts = P.trades.filter((t) => f === "all" || (f === "in" ? t.inPlaybook : !t.inPlaybook)), s = stats(ts);
    const bySetup = {}; for (const t of P.trades) { const k = t.inPlaybook ? t.setup : "Playbookon kívül"; (bySetup[k] = bySetup[k] || []).push(t); }
    const pts = [0]; let c = 0; for (const t of ts) { c += t.pnl; pts.push(c); }
    el.innerHTML = `<div class="pagehead"><div><h1>Journal</h1><p class="sub">Minden szimulált trade automatikusan naplózva, a playbook-megfeleléssel együtt.</p></div><div class="seg" id="jf"><button data-f="all" class="${f === "all" ? "on" : ""}">Mind</button><button data-f="in" class="${f === "in" ? "on" : ""}">Playbookon belül</button><button data-f="out" class="${f === "out" ? "on" : ""}">Kívül</button></div></div>
    <div class="grid3"><section class="box span2"><h2>Kumulált P&L</h2>${equitySvg(pts)}</section><section class="box"><h2>Statisztika</h2><dl class="kvs">${stat("Trade", s.n)}${stat("Win rate", (s.wr * 100).toFixed(1) + "%")}${stat("Profit factor", s.pf === Infinity ? "∞" : s.pf.toFixed(2))}${stat("Átlag R", s.avgR.toFixed(2), s.avgR >= 0 ? "up" : "dn")}${stat("Nettó", usd(s.net, true), s.net >= 0 ? "up" : "dn")}${stat("Playbookon belül", (s.inPb * 100).toFixed(0) + "%")}</dl></section></div>
    <section class="box" style="margin-top:12px"><h2>Setup szerint</h2>${Object.keys(bySetup).length ? `<table><thead><tr><th>Setup</th><th>Trade</th><th>Win rate</th><th>Átlag R</th><th>Nettó</th></tr></thead><tbody>${Object.entries(bySetup).map(([k, v]) => { const x = stats(v); return `<tr><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${(x.wr * 100).toFixed(0)}%</td><td class="num ${x.avgR >= 0 ? "up" : "dn"}">${x.avgR.toFixed(2)}</td><td class="num ${x.net >= 0 ? "up" : "dn"}">${usd(x.net, true)}</td></tr>`; }).join("")}</tbody></table>` : `<div class="empty">Még nincs adat.</div>`}</section>
    <section class="box" style="margin-top:12px"><h2>Trade-ek</h2>${tradeTable([...ts].reverse())}</section>`;
    document.getElementById("jf").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { f = b.dataset.f; draw(); } }; };
  draw();
};

V.library = (el) => {
  const T = [["lab", "GODMODE Lab", "Élő chart minden indikátor-elemmel, kattintható magyarázatokkal; 11 modul a v1.7 kódjával."], ["sim", "Coached replay (értékelés nélkül)", "A 10 kurált forgatókönyv döntési magyarázatokkal, számla nélkül."], ["score", "Score kalkulátor", "Súlyok, küszöbök, szűrők — miért WAIT magas score mellett."], ["risk", "Kockázatkalkulátor", "Kontraktusszám, dollárkockázat, R:R, NO TRADE."], ["glossary", "Szójegyzék", `${C.GLOSSARY.length} kifejezés angolul és magyarul.`], ["cards", "Szókártyák", "Terminológia ismétlése."], ["checklist", "Napi ellenőrzőlista", "15 lépéses munkafolyamat."], ["quiz", "Kérdésbank", "Mind a 20 lecke kérdései, nehézség szerint."]];
  el.innerHTML = `<div class="pagehead"><div><h1>Library</h1><p class="sub">Referencia és eszközök.</p></div></div><section class="box"><table><tbody>${T.map(([h, t, d]) => `<tr><td style="width:280px"><a href="#${h}"><b>${t}</b></a></td><td class="dim">${d}</td></tr>`).join("")}</tbody></table></section>
  <section class="box" style="margin-top:12px"><h2>Mentés</h2><p class="dim" style="margin:0 0 10px;font-size:13.5px">A profil, a számlák, a playbook és a journal ebben a böngészőben tárolódik. Másik eszközre exportálható.</p><div class="ctrl" style="margin:0"><button class="btn sm" id="exp">Export (vágólap)</button><button class="btn sm" id="imp">Import</button><button class="btn sm" id="rst">Teljes reset</button></div><div id="sv"></div></section>`;
  document.getElementById("exp").onclick = () => { const code = btoa(unescape(encodeURIComponent(JSON.stringify({ P, S })))); document.getElementById("sv").innerHTML = `<textarea readonly aria-label="Export" style="width:100%;height:80px;margin-top:10px;background:var(--bg2);color:var(--text);border:1px solid var(--line2);padding:8px;font:11px 'JetBrains Mono',monospace">${code}</textarea>`; navigator.clipboard?.writeText(code).catch(() => {}); };
  document.getElementById("imp").onclick = () => { const code = prompt("Export kód:"); if (!code) return; try { const d = JSON.parse(decodeURIComponent(escape(atob(code.trim())))); P = Object.assign(P, d.P); S = Object.assign(S, d.S); psave(); save(); proute(); } catch (e) { alert("Érvénytelen kód."); } };
  document.getElementById("rst").onclick = () => { if (confirm("Minden adat törlődik (profil, számlák, playbook, journal). Folytatod?")) { try { localStorage.removeItem(PKEY); localStorage.removeItem(KEY); } catch (e) {} location.hash = "#desk"; location.reload(); } };
};

// ── router ──
function proute() {
  cleanup.forEach((f) => { try { f(); } catch (e) {} }); cleanup = []; if (!modal.dataset.locked) closeAll();
  const el = document.getElementById("view"); el.onclick = null; el.oninput = null; el.onchange = null;
  if (!P.trader) { renderNavP("desk"); el.innerHTML = ""; strip(); return onboardingP(); }
  const h = (location.hash || "#desk").slice(1); renderNavP(h); strip();
  const m = h.match(/^(session|assess|lesson|lab|sim)-(.+)$/);
  if (m) { const [, k, a] = m; if (k === "lesson") { S.unlockAll = true; V.lesson(el, a); const done = () => { P.studied[a] = Date.now(); psave(); }; const hk = (e) => { if (e.target.id === "complete") done(); }; el.addEventListener("click", hk); onLeave(() => el.removeEventListener("click", hk)); } else if (k === "lab") V["lab-"](el, a); else V[k](el, a); }
  else (V[h] || V.desk)(el);
  el.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
addEventListener("hashchange", proute);
proute();
})();
</script>
